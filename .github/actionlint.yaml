# Configuration for actionlint (https://github.com/rhysd/actionlint).
# Declares the repo's custom self-hosted runner labels so actionlint does
# not flag `runs-on: self-hosted-linux` / `self-hosted-mac` as unknown.
self-hosted-runner:
  labels:
    - self-hosted-linux
    - self-hosted-mac
    # 2-runner subpool (mimir runners 4 + 5) that caps concurrent Android
    # Release Builds at 2 (each Gradle daemon is ~8-11GiB). See runners/docker-compose.yml.
    - android-builder
