name: 'Deploy Website'
description: 'Deploy website content via rsync to the web server'

inputs:
  ssh_private_key:
    description: 'SSH private key for deployment'
    required: true
  ssh_destination:
    description: 'user@host of the web host (vars.WEB_DEPLOY_SSH)'
    required: true
  ssh_port:
    description: 'SSH port of the web host (vars.WEB_DEPLOY_PORT)'
    required: true
  content_paths:
    description: 'Space-separated paths to deploy (relative to repo root). A trailing slash on a single path copies its contents into target_dir; without a trailing slash the directory itself lands inside target_dir.'
    required: false
    default: 'website/config website/content'
  deploy_root:
    description: 'Absolute remote directory the web host serves from (vars.WEB_DEPLOY_ROOT), without a trailing slash.'
    required: true
  target_subdir:
    description: 'Directory under deploy_root to rsync into, e.g. "staging/sites/<slug>/". Empty deploys into deploy_root itself. End it in a slash if you want the rsync source(s) to land inside it.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        cat > ~/.ssh/deploy_key <<< "${{ inputs.ssh_private_key }}"
        chmod 600 ~/.ssh/deploy_key

    - name: Deploy via rsync
      shell: bash
      env:
        DEST: ${{ inputs.ssh_destination }}
        PORT: ${{ inputs.ssh_port }}
        ROOT: ${{ inputs.deploy_root }}
        SUBDIR: ${{ inputs.target_subdir }}
        CONTENT: ${{ inputs.content_paths }}
      run: |
        # The host comes from repo variables so no instance details live in
        # the (public) repo. The root is checked on its own: with --delete, an
        # empty root would turn the target into the remote filesystem root.
        if [ -z "$DEST" ] || [ -z "$PORT" ] || [[ ! "$ROOT" =~ ^/[^/].* ]]; then
          echo "::error::vars.WEB_DEPLOY_SSH, vars.WEB_DEPLOY_PORT and vars.WEB_DEPLOY_ROOT (an absolute path, not /) must be set"
          exit 1
        fi
        TARGET="${ROOT%/}/$SUBDIR"
        # -k/--copy-dirlinks: website/content/{css,fonts,.well-known} are
        # symlinks into server/services/web/static/, where the Go server
        # embeds them from (#2953). This ships their contents as real
        # directories. It deliberately does NOT dereference *file* symlinks,
        # so content/legal/privacy-policy.html keeps deploying as a symlink
        # exactly as before.
        # $CONTENT is unquoted on purpose: it is a space-separated path list.
        # shellcheck disable=SC2086
        rsync -avzk --delete \
          -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=no" \
          $CONTENT \
          "$DEST:$TARGET"

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        rm -f ~/.ssh/deploy_key
