name: Build Renovate Image

# Rebuilds the self-hosted Renovate image into mimir's local daemon, with NO
# container registry and NO host credential — same pattern as the runner image
# (build_runner_image.yaml). The job runs on a self-hosted runner whose
# containers mount the host Docker socket, so `docker build` here tags
# ripls-renovate:latest straight in mimir's image store, exactly where the
# Renovate cron (renovate/run_renovate.sh) runs it from.
#
# Unlike the runner fleet there is no "recreate" step: the cron does
# `docker run --rm ripls-renovate:latest` each fire, so it always picks up the
# newest image with no long-running container to roll.
#
# GO_VERSION comes from versions.env so the baked Go bootstrap tracks the single
# source of truth (GOTOOLCHAIN=auto then fetches what go.mod pins at run time).

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "versions.env"
      - "renovate/Dockerfile"
      - ".github/workflows/build_renovate_image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Only the repo that owns the runner fleet builds its image (see
    # docs/infra/dependency_automation.md, "Instance-only workflows").
    if: vars.INSTANCE_PIPELINES == 'true'
    runs-on: self-hosted-linux
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fix git ownership (self-hosted runner)
        run: git config --global --add safe.directory '*'

      - name: Load toolchain versions
        run: |
          set -a
          . versions.env
          set +a
          echo "GO_VERSION=${GO_VERSION}" >> "$GITHUB_ENV"

      - name: Build Renovate image into the host daemon
        # Builds via the mounted /var/run/docker.sock, so ripls-renovate:latest
        # lands in mimir's local image store. No push, no registry.
        run: |
          docker build \
            -f renovate/Dockerfile \
            -t ripls-renovate:latest \
            --build-arg "GO_VERSION=${GO_VERSION}" \
            renovate
