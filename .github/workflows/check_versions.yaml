name: Check Versions

# Enforces that the toolchain versions consumed across the repo stay in sync
# with the single source of truth, versions.env (scripts/check_versions.js).
# Runs on every PR to main (no path filter) so drift introduced anywhere is
# caught, and is intended to be a REQUIRED status check — which also makes it a
# valid gate for Renovate auto-merge (see renovate.json / #2287).
#
# check_versions.js itself depends only on Node built-ins (fs/path) and runs with
# no `npm install`. The script unit tests, however, can pull devDeps (e.g.
# doc_freshness.test.js → js-yaml), so `npm install` runs before them.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-versions:
    name: Check Versions
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fix git ownership (self-hosted runner)
        run: git config --global --add safe.directory '*'

      - name: Check toolchain versions against versions.env
        run: node scripts/check_versions.js

      - name: Install npm dependencies (script tests may need devDeps)
        run: npm install

      - name: Run script unit tests
        run: npm run test:scripts

  # Forgejo has no `workflow_run` trigger, so a failure here on a claude/* or
  # renovate/* pull request is handed to its CI fixer by this job (#3293). It
  # never runs on GitHub, where the fixers listen for workflow_run themselves.
  # See .github/scripts/ci_failure_hook.sh.
  fixer:
    name: Hand a failure to the CI fixer
    needs: [check-versions]
    if: ${{ failure() && github.server_url != 'https://github.com' && github.event_name == 'pull_request' }}
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The default branch's copy: a pull request must not supply the
          # script that starts an agent on it.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/ci_failure_hook.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: bash .github/scripts/ci_failure_hook.sh
        env:
          TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
