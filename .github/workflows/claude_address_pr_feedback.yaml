name: Claude Address PR Feedback

# Dispatcher for the address agent (#2970). The agent addresses review feedback
# on a same-repo PR: commits a fix and/or replies. It runs in the private agent
# repo (vars.AGENT_REPO); this workflow holds no agent secrets. Comment and
# review text never crosses the bridge: the agent fetches it by id and checks
# it is the actor's.
#
# The run-name is part of the contract: the agent refuses requests whose
# caller run isn't named "agent-dispatch address <pr>".

run-name: agent-dispatch address ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to address feedback on
        required: true
        type: string
      instruction:
        description: What you want Claude to do
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    # Trigger paths (plan and implementing PRs are excluded; refine and
    # implement own those):
    #   - workflow_dispatch (manual)
    #   - an @claude comment, inline review comment or review on a PR, but
    #     not `@claude implement`
    #   - any commenting or change-requesting review on a claude-implemented
    #     PR, with or without @claude (auto-address)
    # TRUSTED ACTORS ONLY — see the note in claude_plan_issue.yaml. This one
    # matters most: it acts on review feedback, which on a public repo is
    # attacker-controlled text even before the trigger is.
    #
    # ON FORGEJO (#3293), beyond what claude_plan_issue.yaml lists:
    #   - A review has `review.content` and `review.type`, not `body` and
    #     `state`.
    #   - A review of kind "comment" arrives as a pull_request_review_comment
    #     event that carries a `review` and no `comment`. On GitHub that event
    #     is one inline comment and always carries `comment`. So "a review" is
    #     either event, as long as there is no `comment`.
    #   - Review kinds: "commented" is type pull_request_review_comment and
    #     "changes_requested" is pull_request_review_rejected.
    if: |
      vars.AGENT_REPO != '' &&
      (vars.AGENT_DISPATCH_APP_ID != '' || github.server_url != 'https://github.com') &&
      github.actor != 'ripls-agent[bot]' &&
      !contains(fromJSON(vars.BOT_LOGINS || '[]'), github.actor) && (
        github.event_name == 'workflow_dispatch' ||
        (
          (
            github.server_url != 'https://github.com' ||
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
          ) &&
          (
            (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude implement') && !contains(github.event.issue.labels.*.name, 'claude-plan-pr') && !contains(github.event.issue.labels.*.name, 'claude-implementing')) ||
            (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude implement') && !contains(github.event.pull_request.labels.*.name, 'claude-plan-pr') && !contains(github.event.pull_request.labels.*.name, 'claude-implementing')) ||
            ((github.event_name == 'pull_request_review' || (github.event_name == 'pull_request_review_comment' && !github.event.comment)) && contains((github.event.review.body || github.event.review.content), '@claude') && !contains((github.event.review.body || github.event.review.content), '@claude implement') && !contains(github.event.pull_request.labels.*.name, 'claude-plan-pr') && !contains(github.event.pull_request.labels.*.name, 'claude-implementing')) ||
            ((github.event_name == 'pull_request_review' || (github.event_name == 'pull_request_review_comment' && !github.event.comment)) && (github.event.review.state == 'commented' || github.event.review.state == 'changes_requested' || github.event.review.type == 'pull_request_review_comment' || github.event.review.type == 'pull_request_review_rejected') && contains(github.event.pull_request.labels.*.name, 'claude-implemented') && !contains(github.event.pull_request.labels.*.name, 'claude-plan-pr') && !contains(github.event.pull_request.labels.*.name, 'claude-implementing') && !contains((github.event.review.body || github.event.review.content), '@claude implement'))
          )
        )
      )
    # GitHub-hosted on purpose: the sparse checkout below would leave its sparse
    # config in a reused self-hosted workspace and poison later checkouts there
    # (see the note in claude_fix_renovate_ci.yaml). Hosted runners are fresh.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatch action
        uses: actions/checkout@v7
        with:
          # Review events check out the PR's merge commit by default. Pin the
          # action to the default branch so PR code never runs with the key.
          ref: ${{ github.event.repository.default_branch }}
          # `scripts` is for scripts/forge, which the action needs on Forgejo.
          sparse-checkout: |
            .github/actions/agent-dispatch
            scripts
          persist-credentials: false

      - name: Dispatch to the agent
        uses: ./.github/actions/agent-dispatch
        with:
          app-id: ${{ vars.AGENT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.AGENT_DISPATCH_PRIVATE_KEY }}
          dispatch-token: ${{ secrets.AGENT_DISPATCH_TOKEN }}
          agent-repo: ${{ vars.AGENT_REPO }}
          mode: address
          number: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          trigger-kind: >-
            ${{ github.event_name == 'issue_comment' && 'comment'
             || (github.event_name == 'pull_request_review_comment' && github.event.comment) && 'review_comment'
             || github.event_name == 'workflow_dispatch' && 'manual'
             || 'review' }}
          trigger-id: ${{ github.event.comment.id || github.event.review.id }}
          instruction: ${{ inputs.instruction }}
