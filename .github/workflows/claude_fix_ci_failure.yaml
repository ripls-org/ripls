name: Claude Fix CI Failure

# Dispatcher for the fix-ci agent (#2970). When CI fails on a claude/* PR, the
# agent investigates the failed run and pushes a fix or comments. It runs in
# the private agent repo (vars.AGENT_REPO); this workflow holds no agent
# secrets. `workflow_run` only fires in the repo that owns the failed run,
# which is why this trigger stays here.
#
# The run-name is part of the contract: "agent-dispatch fix-ci <failed run id>"
# for CI failures, "<pr>" for manual runs. The agent checks the failed run is
# on the PR's own branch and still at its head.

run-name: agent-dispatch fix-ci ${{ github.event.workflow_run.id || inputs.pr_number }}

on:
  workflow_run:
    workflows:
      - "Go Tests"
      - "Flutter Tests"
      - "Terraform Tests"
      - "Test iOS Build"
      - "Test Docker Build"
      - "AI Provider Integration Tests"
      - "Run End-to-End Tests on Dev"
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number with the failing checks
        required: true
        type: string
      failed_run_id:
        description: ID of the failed Actions run to investigate (optional)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    # SAME-REPO ONLY: a fork can name its branch claude/*, so check where the
    # head lives, not just the name. The agent re-checks.
    if: |
      vars.AGENT_DISPATCH_APP_ID != '' && vars.AGENT_REPO != '' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'failure' &&
         startsWith(github.event.workflow_run.head_branch, 'claude/') &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    # GitHub-hosted on purpose: the sparse checkout below would leave its sparse
    # config in a reused self-hosted workspace and poison later checkouts there
    # (see the note in claude_fix_renovate_ci.yaml). Hosted runners are fresh.
    runs-on: ubuntu-latest
    steps:
      - name: Find the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_PR: ${{ inputs.pr_number }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PR:-}" ]; then
            PR_NUMBER="$INPUT_PR"
          else
            PR_NUMBER=$(gh pr list --state open --head "$WR_HEAD_BRANCH" \
              --json number --jq '.[0].number // empty')
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::No open PR for branch ${WR_HEAD_BRANCH:-?}; nothing to do."
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout dispatch action
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/agent-dispatch
          persist-credentials: false

      - name: Dispatch to the agent
        if: steps.pr.outputs.number != ''
        uses: ./.github/actions/agent-dispatch
        with:
          app-id: ${{ vars.AGENT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.AGENT_DISPATCH_PRIVATE_KEY }}
          agent-repo: ${{ vars.AGENT_REPO }}
          mode: fix-ci
          number: ${{ steps.pr.outputs.number }}
          failed-run-id: ${{ github.event.workflow_run.id || inputs.failed_run_id }}
