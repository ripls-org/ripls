name: Claude Implement Plan

# Dispatcher for the implement agent (#2970). A Sonnet agent executes an
# approved plan PR's plan file, pushes, and turns the PR into a code PR. The
# agent runs in the private agent repo (vars.AGENT_REPO); this workflow holds
# no agent secrets.
#
# It records the PR's head commit at request time. The agent refuses to run if
# the PR has moved since, so it never implements a plan other than the one the
# human approved.
#
# The run-name is part of the contract: the agent refuses requests whose
# caller run isn't named "agent-dispatch implement <pr>".

run-name: agent-dispatch implement ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Forgejo only: a review of kind "comment" arrives as this event. See the
  # job's `if:`.
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Plan PR number to implement
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    # Trigger paths:
    #   - workflow_dispatch (manual)
    #   - issue_comment on a PR containing `@claude implement`
    #   - pull_request_review submitted with `@claude implement` in the body
    # TRUSTED ACTORS ONLY — see the note in claude_plan_issue.yaml.
    #
    # ON FORGEJO (#3293), beyond what claude_plan_issue.yaml lists:
    #   - A review has `review.content` and `review.type`, not `body` and
    #     `state`.
    #   - A review of kind "comment" arrives as a pull_request_review_comment
    #     event that carries a `review` and no `comment`. On GitHub that event
    #     is one inline comment and always carries `comment`. So "a review" is
    #     either event, as long as there is no `comment`.
    if: |
      vars.AGENT_REPO != '' &&
      (vars.AGENT_DISPATCH_APP_ID != '' || github.server_url != 'https://github.com') &&
      github.actor != 'ripls-agent[bot]' &&
      !contains(fromJSON(vars.BOT_LOGINS || '[]'), github.actor) && (
        github.event_name == 'workflow_dispatch' ||
        (
          (
            github.server_url != 'https://github.com' ||
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
          ) &&
          (
            (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude implement')) ||
            ((github.event_name == 'pull_request_review' || (github.event_name == 'pull_request_review_comment' && !github.event.comment)) && contains((github.event.review.body || github.event.review.content), '@claude implement'))
          )
        )
      )
    # GitHub-hosted on purpose: the sparse checkout below would leave its sparse
    # config in a reused self-hosted workspace and poison later checkouts there
    # (see the note in claude_fix_renovate_ci.yaml). Hosted runners are fresh.
    runs-on: ubuntu-latest
    env:
      NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Checkout dispatch action
        uses: actions/checkout@v7
        with:
          # Review events check out the PR's merge commit by default. Pin the
          # action to the default branch so PR code never runs with the key.
          ref: ${{ github.event.repository.default_branch }}
          # `scripts` is for scripts/forge, which the action needs on Forgejo.
          sparse-checkout: |
            .github/actions/agent-dispatch
            scripts
          persist-credentials: false

      - name: Record PR head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: echo "sha=$(scripts/forge pr view "$NUMBER" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"

      - name: Dispatch to the agent
        uses: ./.github/actions/agent-dispatch
        with:
          app-id: ${{ vars.AGENT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.AGENT_DISPATCH_PRIVATE_KEY }}
          dispatch-token: ${{ secrets.AGENT_DISPATCH_TOKEN }}
          agent-repo: ${{ vars.AGENT_REPO }}
          mode: implement
          number: ${{ env.NUMBER }}
          trigger-kind: ${{ github.event_name == 'issue_comment' && 'comment' || github.event_name == 'workflow_dispatch' && 'manual' || 'review' }}
          trigger-id: ${{ github.event.comment.id || github.event.review.id }}
          head-sha: ${{ steps.head.outputs.sha }}
