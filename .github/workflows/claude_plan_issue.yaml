name: Claude Plan Issue

# Dispatcher for the plan agent (#2970). An Opus agent triages an issue and
# opens a fast-path fix PR, a draft plan PR, or a blocked comment. The agent
# runs in the private agent repo (vars.AGENT_REPO); this workflow holds no
# agent secrets. It gates on the event and passes identifiers; the agent
# re-validates the request and re-reads the issue itself.
#
# The run-name is part of the contract: the agent refuses requests whose
# caller run isn't named "agent-dispatch plan <issue>".
#
# Configuration: AGENT_REPO and AGENT_DISPATCH_APP_ID (variables),
# AGENT_DISPATCH_PRIVATE_KEY (secret). Without both variables (e.g. on a fork,
# or a copy of the repo with no agent configured) the job is skipped.

run-name: agent-dispatch plan ${{ github.event.issue.number || inputs.issue_number }}

on:
  issues:
    types: [labeled, opened, assigned]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to plan
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    # Trigger paths:
    #   - workflow_dispatch (manual)
    #   - issues labeled with `claude-fix`
    #   - issues opened or assigned with @claude in title or body
    #   - issue comments containing @claude (not PR comments)
    # Skip self-triggered events: the agent's "Plan drafted at PR #..." comment
    # contains `@claude` as part of the reviewer instructions.
    # TRUSTED ACTORS ONLY. `issues` and `issue_comment` fire for anyone who can
    # see the repo, so on a public repo the author_association check is what
    # stops any GitHub user from starting the agent. workflow_dispatch needs
    # write access already. See #2953 / OSS-7 #2959.
    #
    # ON FORGEJO (#3293) three things in this condition are spelled differently:
    #   - There is no author_association, so the trust test cannot live here.
    #     Candidate events get through and the dispatch action asks whether the
    #     actor is an organization member.
    #   - Bots are ordinary accounts with no `[bot]` suffix; their logins are in
    #     vars.BOT_LOGINS (a JSON array).
    #   - A label change arrives with action `label_updated`, for removals too,
    #     so the label must also still be on the issue.
    if: |
      vars.AGENT_REPO != '' &&
      (vars.AGENT_DISPATCH_APP_ID != '' || github.server_url != 'https://github.com') &&
      github.actor != 'ripls-agent[bot]' &&
      !contains(fromJSON(vars.BOT_LOGINS || '[]'), github.actor) && (
        github.event_name == 'workflow_dispatch' ||
        (
          (
            github.server_url != 'https://github.com' ||
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association)
          ) &&
          (
            (github.event_name == 'issues' && contains(fromJSON('["labeled","label_updated"]'), github.event.action) && github.event.label.name == 'claude-fix' && contains(github.event.issue.labels.*.name, 'claude-fix')) ||
            (github.event_name == 'issues' && !contains(fromJSON('["labeled","label_updated"]'), github.event.action) && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
            (github.event_name == 'issue_comment' && !github.event.issue.pull_request && contains(github.event.comment.body, '@claude'))
          )
        )
      )
    # GitHub-hosted on purpose: the sparse checkout below would leave its sparse
    # config in a reused self-hosted workspace and poison later checkouts there
    # (see the note in claude_fix_renovate_ci.yaml). Hosted runners are fresh.
    # On Forgejo this label is the fleet, where every job has a fresh container.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatch action
        uses: actions/checkout@v7
        with:
          # `scripts` is for scripts/forge, which the action needs on Forgejo.
          sparse-checkout: |
            .github/actions/agent-dispatch
            scripts
          persist-credentials: false

      - name: Dispatch to the agent
        uses: ./.github/actions/agent-dispatch
        with:
          app-id: ${{ vars.AGENT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.AGENT_DISPATCH_PRIVATE_KEY }}
          dispatch-token: ${{ secrets.AGENT_DISPATCH_TOKEN }}
          agent-repo: ${{ vars.AGENT_REPO }}
          mode: plan
          number: ${{ github.event.issue.number || inputs.issue_number }}
