name: Claude Refine Plan

# Dispatcher for the refine agent (#2970). An Opus agent edits a draft plan PR's
# plan file, or answers a question about it, in response to an `@claude`
# comment or review. The agent runs in the private agent repo (vars.AGENT_REPO);
# this workflow holds no agent secrets. It gates on the event, mints a token
# from the ripls-dispatch GitHub App and passes identifiers across. The agent
# re-checks everything (PR state, labels, plan markers, that the comment or
# review is the actor's) and fetches the trigger text itself by id.
#
# The run-name is part of the contract: the agent refuses requests whose
# caller run isn't named "agent-dispatch refine <pr>".
#
# Configuration: AGENT_REPO and AGENT_DISPATCH_APP_ID (variables),
# AGENT_DISPATCH_PRIVATE_KEY (secret). Without both variables (e.g. on a fork,
# or a copy of the repo with no agent configured) the job is skipped.

run-name: agent-dispatch refine ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Forgejo only: a review of kind "comment" arrives as this event. See the
  # job's `if:`.
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Plan PR number to refine
        required: true
        type: string
      instruction:
        description: What to change in the plan (free-form)
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    # Trigger paths:
    #   - workflow_dispatch (manual)
    #   - issue_comment on a PR carrying the claude-plan-pr label, with
    #     `@claude` in the body but NOT `@claude implement`
    #   - a submitted review with the same conditions
    # Self-triggered events are filtered out.
    # TRUSTED ACTORS ONLY — see the note in claude_plan_issue.yaml.
    #
    # ON FORGEJO (#3293), beyond what claude_plan_issue.yaml lists:
    #   - A review has `review.content` and `review.type`, not `body` and
    #     `state`.
    #   - A review of kind "comment" arrives as a pull_request_review_comment
    #     event that carries a `review` and no `comment`. On GitHub that event
    #     is one inline comment and always carries `comment`. So "a review" is
    #     either event, as long as there is no `comment`.
    if: |
      vars.AGENT_REPO != '' &&
      (vars.AGENT_DISPATCH_APP_ID != '' || github.server_url != 'https://github.com') &&
      github.actor != 'ripls-agent[bot]' &&
      !contains(fromJSON(vars.BOT_LOGINS || '[]'), github.actor) && (
        github.event_name == 'workflow_dispatch' ||
        (
          (
            github.server_url != 'https://github.com' ||
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
          ) &&
          (
            (github.event_name == 'issue_comment' &&
             github.event.issue.pull_request &&
             contains(github.event.comment.body, '@claude') &&
             !contains(github.event.comment.body, '@claude implement') &&
             contains(github.event.issue.labels.*.name, 'claude-plan-pr')) ||
            ((github.event_name == 'pull_request_review' || (github.event_name == 'pull_request_review_comment' && !github.event.comment)) &&
             contains((github.event.review.body || github.event.review.content), '@claude') &&
             !contains((github.event.review.body || github.event.review.content), '@claude implement') &&
             contains(github.event.pull_request.labels.*.name, 'claude-plan-pr'))
          )
        )
      )
    # GitHub-hosted on purpose: the sparse checkout below would leave its sparse
    # config in a reused self-hosted workspace and poison later checkouts there
    # (see the note in claude_fix_renovate_ci.yaml). Hosted runners are fresh.
    # On Forgejo this label is the fleet, where every job has a fresh container.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatch action
        uses: actions/checkout@v7
        with:
          # Review events check out the PR's merge commit by default. Pin the
          # action to the default branch so PR code never runs with the key.
          ref: ${{ github.event.repository.default_branch }}
          # `scripts` is for scripts/forge, which the action needs on Forgejo.
          sparse-checkout: |
            .github/actions/agent-dispatch
            scripts
          persist-credentials: false

      # Only ids cross the bridge for comment and review triggers; the agent
      # fetches the text. A manual instruction is the one free-text input, and
      # only workflow_dispatch (write access) can supply it.
      - name: Dispatch to the agent
        uses: ./.github/actions/agent-dispatch
        with:
          app-id: ${{ vars.AGENT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.AGENT_DISPATCH_PRIVATE_KEY }}
          dispatch-token: ${{ secrets.AGENT_DISPATCH_TOKEN }}
          agent-repo: ${{ vars.AGENT_REPO }}
          mode: refine
          number: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
          trigger-kind: ${{ github.event_name == 'issue_comment' && 'comment' || github.event_name == 'workflow_dispatch' && 'manual' || 'review' }}
          trigger-id: ${{ github.event.comment.id || github.event.review.id }}
          instruction: ${{ inputs.instruction }}
