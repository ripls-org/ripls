name: Claude Refine Plan

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Plan PR number to refine
        required: true
        type: string
      instruction:
        description: What to change in the plan (free-form)
        required: true
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write
  actions: read
  id-token: write

# Serialize per PR so racing refine mentions don't fight over the plan file.
concurrency:
  group: claude-refine-plan-pr-${{ github.event.inputs.pr_number || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  discover:
    # Trigger paths:
    #   - workflow_dispatch (manual)
    #   - issue_comment on a PR carrying the claude-plan-pr label, with
    #     `@claude` in the body but NOT `@claude implement`
    #   - pull_request_review submitted with the same conditions
    # Self-triggered events are filtered out.
    # TRUSTED ACTORS ONLY — see the note in claude_plan_issue.yaml.
    if: |
      github.actor != 'claude[bot]' && (
        github.event_name == 'workflow_dispatch' ||
        (
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association) &&
          (
            (github.event_name == 'issue_comment' &&
             github.event.issue.pull_request &&
             contains(github.event.comment.body, '@claude') &&
             !contains(github.event.comment.body, '@claude implement') &&
             contains(github.event.issue.labels.*.name, 'claude-plan-pr')) ||
            (github.event_name == 'pull_request_review' &&
             contains(github.event.review.body, '@claude') &&
             !contains(github.event.review.body, '@claude implement') &&
             contains(github.event.pull_request.labels.*.name, 'claude-plan-pr'))
          )
        )
      )
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      pr_number: ${{ steps.guard.outputs.pr_number }}
      head_ref: ${{ steps.guard.outputs.head_ref }}
      head_sha: ${{ steps.guard.outputs.head_sha }}
      issue_number: ${{ steps.guard.outputs.issue_number }}
      plan_path: ${{ steps.guard.outputs.plan_path }}
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
          ISSUE_PR_NUM: ${{ github.event.issue.number }}
          REVIEW_PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_NUMBER="${INPUT_PR:-${ISSUE_PR_NUM:-${REVIEW_PR_NUM:-}}}"
          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::Could not resolve PR number from event; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr view "$PR_NUMBER" \
            --json number,headRefName,headRefOid,baseRefName,state,isDraft,body,labels \
            > /tmp/pr.json
          STATE=$(jq -r '.state' /tmp/pr.json)
          IS_DRAFT=$(jq -r '.isDraft' /tmp/pr.json)
          HEAD_REF=$(jq -r '.headRefName' /tmp/pr.json)
          HEAD_SHA=$(jq -r '.headRefOid' /tmp/pr.json)
          BODY=$(jq -r '.body // ""' /tmp/pr.json)
          HAS_LABEL=$(jq -r '[.labels[].name] | index("claude-plan-pr") // empty' /tmp/pr.json)
          if [ "$STATE" != "OPEN" ]; then
            echo "::notice::PR #$PR_NUMBER is $STATE; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::notice::PR #$PR_NUMBER is no longer a draft; refine only runs while the plan is in flux."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$HAS_LABEL" ]; then
            echo "::notice::PR #$PR_NUMBER does not carry claude-plan-pr label; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ISSUE_NUMBER=$(printf '%s' "$BODY" | sed -n 's/.*<!-- claude-plan-pr: *\([0-9][0-9]*\) *-->.*/\1/p' | head -1)
          PLAN_PATH=$(printf '%s' "$BODY" | sed -n 's|.*<!-- claude-plan-path: *\([^ ]*\) *-->.*|\1|p' | head -1)
          if [ -z "$ISSUE_NUMBER" ] || [ -z "$PLAN_PATH" ]; then
            echo "::notice::PR #$PR_NUMBER body missing claude-plan-pr / claude-plan-path markers; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$HEAD_REF" in
            claude/*) ;;
            *)
              echo "::notice::PR #$PR_NUMBER head $HEAD_REF is not claude/*; skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "plan_path=$PLAN_PATH" >> "$GITHUB_OUTPUT"

  refine:
    needs: discover
    if: needs.discover.outputs.should_run == 'true'
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
      PR_NUMBER: ${{ needs.discover.outputs.pr_number }}
      HEAD_REF: ${{ needs.discover.outputs.head_ref }}
      HEAD_SHA: ${{ needs.discover.outputs.head_sha }}
      ISSUE_NUMBER: ${{ needs.discover.outputs.issue_number }}
      PLAN_PATH: ${{ needs.discover.outputs.plan_path }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.CLAUDE_WORKFLOW_PAT }}

      - name: Fix git ownership (self-hosted runner)
        run: git config --global --add safe.directory '*'

      - name: Ensure Git LFS files are pulled
        run: |
          git lfs install --local
          git lfs pull

      - name: Setup git identity
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"

      - name: Move to PR branch
        run: git checkout -B "$HEAD_REF"

      - name: Verify plan file exists
        run: |
          set -euo pipefail
          if [ ! -f "$PLAN_PATH" ]; then
            echo "::error::Plan file $PLAN_PATH not found on branch $HEAD_REF."
            exit 1
          fi

      - name: Stage refine context
        id: feedback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INSTRUCTION: ${{ github.event.inputs.instruction }}
          ISSUE_COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          set -euo pipefail
          rm -rf /tmp/refine
          mkdir -p /tmp/refine
          gh pr view "$PR_NUMBER" \
            --json number,title,body,url,headRefName,baseRefName,comments,reviews,files \
            > /tmp/refine/pr.json
          gh issue view "$ISSUE_NUMBER" \
            --json number,title,body,comments,labels,state,url \
            > /tmp/refine/issue.json || echo '{}' > /tmp/refine/issue.json
          case "$EVENT_NAME" in
            workflow_dispatch)
              printf '%s\n' "$INSTRUCTION" > /tmp/refine/trigger.txt
              echo "trigger_kind=manual" >> "$GITHUB_OUTPUT"
              ;;
            issue_comment)
              printf '%s\n' "$ISSUE_COMMENT_BODY" > /tmp/refine/trigger.txt
              echo "trigger_kind=top-level comment" >> "$GITHUB_OUTPUT"
              ;;
            pull_request_review)
              printf '%s\n' "$REVIEW_BODY" > /tmp/refine/trigger.txt
              echo "trigger_kind=submitted review" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Capture pre-run state
        id: pre
        run: echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code (Opus) to refine the plan
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Deliberately no ANTHROPIC_API_KEY: Claude Code prefers it over
          # claude_code_oauth_token, silently billing runs per-token instead
          # of to the subscription. AI integration tests skip without it.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERTEX_AI_PROJECT: ${{ vars.GCP_PROJECT_DEV }}
          CI: "true"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are refining a planning document on draft PR
            #${{ env.PR_NUMBER }} in ${{ github.repository }}, in response to
            reviewer feedback.

            Plan PR:        #${{ env.PR_NUMBER }}
            Plan file:      ${{ env.PLAN_PATH }} (read this from the working tree)
            Issue:          #${{ env.ISSUE_NUMBER }}
            Trigger:        ${{ steps.feedback.outputs.trigger_kind }}
            Trigger text:   /tmp/refine/trigger.txt — this is the literal
                            comment / review / instruction that mentioned
                            @claude. It's what you must respond to.
            PR JSON:        /tmp/refine/pr.json (title, body, comments, reviews)
            Issue JSON:     /tmp/refine/issue.json (original issue + comments)
            Branch:         ${{ env.HEAD_REF }} (already checked out)

            ## Mission

            Decide what kind of feedback the trigger text is — a **directive**
            (asking you to change the plan) or a **question** (asking you to
            explain something). Then act:

              **Directive** → edit the plan file, commit, push, comment.
              **Question** → reply with a comment. Do not edit the plan.
              **Mixed** → answer the question and apply the change. Both.

            When in doubt, prefer replying with a comment instead of editing
            the plan. A wrong edit is worse than a missing one — the human
            can always re-ask.

            The run is **only complete** when one of:

              (a) you edited ${{ env.PLAN_PATH }}, committed, pushed, and
                  commented on the PR explaining what you changed and why,
              (b) you replied to the trigger with a comment and made no
                  edits, or
              (c) you posted a comment explaining why you can't safely act on
                  the trigger.

            Don't stop after analysis. Push commits or comment.

            ## Process

            Use TodoWrite to track these steps.

            1. Read /tmp/refine/trigger.txt — that is the literal request.
               Re-read it before you finish to make sure you addressed it.
            2. Read ${{ env.PLAN_PATH }} so you understand what the current
               plan says.
            3. Read /tmp/refine/pr.json and /tmp/refine/issue.json for prior
               context — earlier comments, reviews, the original issue body.
            4. **Classify** the trigger:
                 - Imperative verbs ("rewrite", "swap", "remove", "add",
                   "use X instead", "split into") → directive.
                 - Interrogatives ("why", "what about", "have you considered",
                   "is option B viable?") → question.
                 - Mix of both → both.
            5. **Directive path.** Make the smallest change to the plan that
               satisfies the request. Preserve the template structure
               (Problem Statement, Context, Potential Solutions,
               Recommendation, Open Questions, Implementation Plan, Related
               Issues). If the request changes the recommended option, update
               the **Recommendation** section so Sonnet executes the new
               choice.

               After editing, **rewrite the PR description** so it reflects
               the new plan — the description holds a ~500-word summary that
               reviewers read first. Use this section structure (the same
               one the original plan PR opened with):

                   <!-- claude-plan-pr: ${{ env.ISSUE_NUMBER }} -->
                   <!-- claude-plan-path: ${{ env.PLAN_PATH }} -->

                   ## Problem (~100 words)
                   ## Approach (~150 words)
                   ## Implementation outline (~200 words; bullet points)
                   ## Risks / open questions (~50 words; omit if none)

                   Full plan: `${{ env.PLAN_PATH }}`

                   Fixes #${{ env.ISSUE_NUMBER }}.

               Both HTML-comment markers MUST be at the top of the body
               verbatim — they're how downstream workflows find the plan.
               If your edit changed the PR's scope (e.g. swapped option
               B for option C), also update the PR title's summary phrase,
               but keep the `[plan]` prefix. Otherwise leave the title.

               Then commit, push, update title/body, and comment:

                   git add ${{ env.PLAN_PATH }}
                   git commit -m "Refine plan for #${{ env.ISSUE_NUMBER }}: <one-line summary>"
                   git push origin ${{ env.HEAD_REF }}
                   gh pr edit ${{ env.PR_NUMBER }} \
                     --body "<rewritten body with markers, summary, Fixes line>" \
                     [--title "[plan] Fix #${{ env.ISSUE_NUMBER }}: <new summary>"  # only if scope changed]
                   gh pr comment ${{ env.PR_NUMBER }} --body "Refined plan in <SHA>: <what I changed and why>. PR description updated to match. Comment \`@claude implement\` when you're happy with it."

            6. **Question path.** Reply with a substantive answer that draws
               on the plan and supporting code. Do not edit the plan file
               or the PR description:

                   gh pr comment ${{ env.PR_NUMBER }} --body "<your answer; cite specific plan sections or files where helpful>"

            7. **Mixed path.** Do step 5 and roll the answer to the question
               into the same PR comment.

            8. **Blocked exit.** If the trigger asks for something you can't
               do (e.g., "rewrite the plan to use library X" but X is wrong
               for this codebase, or the request contradicts CLAUDE.md or an
               earlier accepted constraint), explain that in a comment
               without editing the plan or the description:

                   gh pr comment ${{ env.PR_NUMBER }} --body "<what was asked, why I can't do it, what would need to change first>"

            ## Hard rules

            - Do not implement code. This workflow is plan-only — your only
              file edits should be to ${{ env.PLAN_PATH }}.
            - When editing the plan, you MUST rewrite the PR description to
              match. A stale description that no longer reflects the plan
              file is worse than no description.
            - The two HTML-comment markers (`claude-plan-pr`,
              `claude-plan-path`) must remain at the top of the body
              verbatim — never strip or reword them.
            - The PR title keeps the `[plan]` prefix until implementation
              starts. Only adjust the summary phrase after the prefix, and
              only if the scope genuinely changed.
            - Do not change the PR's labels — the workflow shell handles
              label transitions.
            - Do not mark the PR ready for review. The reviewer triggers that
              by commenting `@claude implement`.
            - No "Co-Authored-By" / "Generated with Claude" branding in
              commits or PR bodies.
            - Do not stop with a summary message before doing step 5, 6, 7,
              or 8.
          claude_args: >-
            --model claude-opus-4-7
            --max-turns 120
            --verbose
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(gh:*),Bash(jq:*),Bash(cat:*),Bash(ls:*)"

      - name: Stage execution log for artifact
        if: always()
        run: |
          DEBUG_DIR="${{ runner.temp }}/claude-debug-${{ github.run_id }}-${{ github.run_attempt }}"
          rm -rf "$DEBUG_DIR"
          mkdir -p "$DEBUG_DIR"
          if [ -f "${{ runner.temp }}/claude-execution-output.json" ]; then
            cp "${{ runner.temp }}/claude-execution-output.json" "$DEBUG_DIR/"
          fi
          if [ -f "${{ runner.temp }}/claude-prompts/claude-prompt.txt" ]; then
            cp "${{ runner.temp }}/claude-prompts/claude-prompt.txt" "$DEBUG_DIR/"
          fi
          cp -r /tmp/refine "$DEBUG_DIR/" 2>/dev/null || true
          ls -la "$DEBUG_DIR/" || true

      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-refine-log-pr${{ env.PR_NUMBER }}-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-debug-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Assert Claude produced a deliverable
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRE_SHA: ${{ steps.pre.outputs.head_sha }}
        run: |
          set -euo pipefail
          REMOTE_SHA=$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$PRE_SHA" ]; then
            echo "PR branch advanced from ${PRE_SHA} to ${REMOTE_SHA}; deliverable (a) satisfied."
            exit 0
          fi
          THIRTY_MIN_AGO=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-30M +%Y-%m-%dT%H:%M:%SZ)
          RECENT_COMMENT=$(gh pr view "$PR_NUMBER" --json comments \
            --jq "[.comments[] | select(.createdAt > \"$THIRTY_MIN_AGO\")] | length")
          if [ "$RECENT_COMMENT" -gt 0 ]; then
            echo "Recent comment posted on PR #$PR_NUMBER; deliverable satisfied."
            exit 0
          fi
          echo "::error::Claude finished without deliverable on PR #$PR_NUMBER. See claude-refine-log artifact."
          exit 1
