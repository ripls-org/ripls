name: Claude Refine Plan

# Dispatcher for the refine agent (#2970). An Opus agent edits a draft plan PR's
# plan file, or answers a question about it, in response to an `@claude`
# comment or review. The agent runs in the private agent repo (vars.AGENT_REPO);
# this workflow holds no agent secrets. It gates on the event, mints a token
# from the ripls-dispatch GitHub App and passes identifiers across. The agent
# re-checks everything (PR state, labels, plan markers, that the comment or
# review is the actor's) and fetches the trigger text itself by id.
#
# The run-name is part of the contract: the agent refuses requests whose
# caller run isn't named "agent-dispatch refine <pr>".
#
# Configuration: AGENT_REPO and AGENT_DISPATCH_APP_ID (variables),
# AGENT_DISPATCH_PRIVATE_KEY (secret). Without both variables (e.g. on the
# public mirror before OSS-17) the job is skipped.

run-name: agent-dispatch refine ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Plan PR number to refine
        required: true
        type: string
      instruction:
        description: What to change in the plan (free-form)
        required: true
        type: string

permissions: {}

jobs:
  dispatch:
    # Trigger paths:
    #   - workflow_dispatch (manual)
    #   - issue_comment on a PR carrying the claude-plan-pr label, with
    #     `@claude` in the body but NOT `@claude implement`
    #   - pull_request_review submitted with the same conditions
    # Self-triggered events are filtered out.
    # TRUSTED ACTORS ONLY — see the note in claude_plan_issue.yaml.
    if: |
      vars.AGENT_DISPATCH_APP_ID != '' && vars.AGENT_REPO != '' &&
      github.actor != 'ripls-agent[bot]' && (
        github.event_name == 'workflow_dispatch' ||
        (
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association) &&
          (
            (github.event_name == 'issue_comment' &&
             github.event.issue.pull_request &&
             contains(github.event.comment.body, '@claude') &&
             !contains(github.event.comment.body, '@claude implement') &&
             contains(github.event.issue.labels.*.name, 'claude-plan-pr')) ||
            (github.event_name == 'pull_request_review' &&
             contains(github.event.review.body, '@claude') &&
             !contains(github.event.review.body, '@claude implement') &&
             contains(github.event.pull_request.labels.*.name, 'claude-plan-pr'))
          )
        )
      )
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - name: Split agent repo name
        id: repo
        env:
          AGENT_REPO: ${{ vars.AGENT_REPO }}
        run: |
          echo "owner=${AGENT_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${AGENT_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint dispatch token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AGENT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.AGENT_DISPATCH_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}

      - name: Dispatch to the agent
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          AGENT_REPO: ${{ vars.AGENT_REPO }}
          EVENT_NAME: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
          # triggering_actor, not actor: on a re-run they differ, and the agent
          # checks this against the run's triggering actor.
          ACTOR: ${{ github.triggering_actor }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REVIEW_ID: ${{ github.event.review.id }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          set -euo pipefail
          # Only ids cross the bridge for comment and review triggers; the agent
          # fetches the text. A manual instruction is the one free-text input,
          # and only workflow_dispatch (write access) can supply it.
          case "$EVENT_NAME" in
            issue_comment) TRIGGER=(-f trigger_kind=comment -f trigger_id="$COMMENT_ID") ;;
            pull_request_review) TRIGGER=(-f trigger_kind=review -f trigger_id="$REVIEW_ID") ;;
            workflow_dispatch) TRIGGER=(-f trigger_kind=manual -f instruction="$INSTRUCTION") ;;
          esac
          # --ref is required: without it gh looks up the default branch, which
          # needs Contents read, and the dispatch App holds only Actions write.
          gh workflow run agent.yaml -R "$AGENT_REPO" --ref main \
            -f mode=refine \
            -f target_repo="$GITHUB_REPOSITORY" \
            -f number="$NUMBER" \
            -f actor="$ACTOR" \
            -f caller_run_id="$GITHUB_RUN_ID" \
            "${TRIGGER[@]}"
          echo "::notice::Dispatched refine for #$NUMBER to $AGENT_REPO."
