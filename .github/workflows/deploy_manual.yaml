name: Manually Deploy a Branch

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: "dev"

jobs:
  build-and-deploy:
    # Instance-only (docs/infra/dependency_automation.md).
    if: vars.INSTANCE_PIPELINES == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build_and_deploy_container.yaml
    with:
      environment: ${{ inputs.environment }}
      deploy: true
    secrets: inherit
