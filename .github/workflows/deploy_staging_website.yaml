name: Deploy Staging Website

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "website/**"
      - ".github/actions/deploy-website/**"
      - ".github/workflows/deploy_staging_website.yaml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: staging-website-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # Deploys to the instance's staging host, so it runs only on the canonical
    # repo and never for a fork's PR: that would run the fork's code on a
    # self-hosted runner with the deploy key.
    if: vars.INSTANCE_PIPELINES == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Walkthrough reel .mp4s are in Git LFS; fetch real files so rsync
          # ships them (not pointer stubs).
          lfs: true

      # actions/checkout's lfs:true fetches objects but doesn't reliably smudge
      # the working tree on PR merge refs — materialize explicitly by OID so
      # rsync ships real files, never 132-byte pointer stubs.
      - name: Materialize Git LFS content
        shell: bash
        run: git lfs pull

      - name: Compute branch slug and URL
        id: slug
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          slug=$(printf '%s' "$HEAD_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c 'a-z0-9-' '-' \
            | sed -E 's/-+/-/g; s/^-+|-+$//g' \
            | cut -c1-30 \
            | sed -E 's/-+$//')
          if [ -z "$slug" ]; then
            slug="pr-${PR_NUMBER}"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "url=https://${slug}.staging.ripls.org/" >> "$GITHUB_OUTPUT"

      - name: Deploy website to staging
        uses: ./.github/actions/deploy-website
        with:
          ssh_private_key: ${{ secrets.WEB_PUBLISH_SSH_PRIVATE_KEY }}
          ssh_destination: ${{ vars.WEB_DEPLOY_SSH }}
          ssh_port: ${{ vars.WEB_DEPLOY_PORT }}
          deploy_root: ${{ vars.WEB_DEPLOY_ROOT }}
          content_paths: "website/content/"
          target_subdir: "staging/sites/${{ steps.slug.outputs.slug }}/"

      # Give this branch its own nginx server block and its own copy of the
      # shared routing snippet.
      #
      # Routing lives in locations.include, shared verbatim with production, so
      # a PR that changes routing has to be exercised on its own preview. This
      # used to be done by rsyncing the snippet to ONE global path that every
      # preview's server block included — so the last website deploy to run set
      # the routing for every branch at once (#2895: the home-page PR's preview
      # kept serving main's `/` for five weeks because six later deploys had
      # overwritten its snippet). Per-branch files remove the collision: nginx
      # prefers an exact server_name over the regex fallback in default.conf,
      # so each preview gets its own routing and nobody else's.
      #
      # The snippet lands before the server block that includes it, so a
      # half-landed state can only fail `nginx -t` — the mimir-side watcher
      # (infra/web-nginx-reload) keeps the last-good config and converges on
      # the next poll.
      - name: Deploy this branch's nginx routing to staging
        env:
          SSH_KEY: ${{ secrets.WEB_PUBLISH_SSH_PRIVATE_KEY }}
          SLUG: ${{ steps.slug.outputs.slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEST: ${{ vars.WEB_DEPLOY_SSH }}
          PORT: ${{ vars.WEB_DEPLOY_PORT }}
          ROOT: ${{ vars.WEB_DEPLOY_ROOT }}
        run: |
          # The slug is built by tr'ing the branch name down to [a-z0-9-], so it
          # is already safe to interpolate into the unquoted heredoc and the
          # remote paths below. Re-assert it rather than trust that by
          # inspection — the branch name is attacker-supplied on a fork PR.
          if [[ ! "$SLUG" =~ ^[a-z0-9-]+$ ]]; then
            echo "Refusing to deploy with unsafe slug: '$SLUG'" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          # Trailing newline is required or OpenSSH rejects the key
          # ("error in libcrypto") — match the deploy-website action's herestring.
          cat > ~/.ssh/deploy_key <<< "$SSH_KEY"
          chmod 600 ~/.ssh/deploy_key
          ssh_opts="ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=no"
          remote="$DEST:${ROOT%/}/staging/config"

          rsync -az -e "$ssh_opts" \
            website/config/locations.include \
            "$remote/locations-$SLUG.include"

          cat > "site-$SLUG.conf" <<CONF
          # Generated by .github/workflows/deploy_staging_website.yaml for PR
          # #$PR_NUMBER. Rewritten on every push; removed by
          # cleanup_staging_website.yaml when the PR closes. Do not hand-edit
          # on the server.
          server {
              listen 80;
              server_name $SLUG.staging.ripls.org;

              root /srv/sites/$SLUG;
              index index.html;

              # Tell crawlers to leave staging alone.
              add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

              # Revalidate every request, so a reviewer never sees a cached
              # page after a deploy. See default.conf for the full reasoning.
              add_header Cache-Control "no-cache" always;

              # This branch's own copy of the shared routing rules.
              include /etc/nginx/conf.d/locations-$SLUG.include;
          }
          CONF
          rsync -az -e "$ssh_opts" "site-$SLUG.conf" "$remote/site-$SLUG.conf"

          rm -f ~/.ssh/deploy_key "site-$SLUG.conf"

      - name: Comment staging URL on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: staging-website
          message: |
            🌐 **Staging website deployed**

            ${{ steps.slug.outputs.url }}

            Updated on each push to this PR. Removed automatically when the PR is closed.
