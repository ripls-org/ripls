name: Renovate PR Automation

# Routes a Renovate pull request by its `automerge` label, which the
# auto-merge packageRules in renovate.json add.
#
# - **Label present** (patch and minor library updates): nothing to do here.
#   renovate.json sets `platformAutomerge`, so Renovate itself asks the forge
#   to merge the pull request once its required checks pass. `main` requires
#   no approving review, so no approval has to be supplied.
#
#   On GitHub this workflow had a second job that approved these pull
#   requests, because the ruleset there required a review that Renovate could
#   not give itself. That job went with the move to Forgejo (#3293).
#
# - **Label absent** (majors, pub, base images, fastlane gems): these need a
#   person's eyes. The job below requests a review from
#   DEFAULT_RENOVATE_REVIEWER and stops there. It does NOT schedule a merge:
#   with no approval required on `main`, a scheduled merge would land on green
#   checks alone and the review would mean nothing. The reviewer merges.
#
# Uses pull_request_target so the job runs in the base-branch context with a
# write token. It checks out only scripts/ from the base branch, never the
# pull request's code, and is gated to pull requests from this repository
# authored by the Renovate account, so there is no untrusted-code exposure.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

# Serialize per pull request and cancel superseded runs. Renovate opens a pull
# request and adds its labels in quick succession, so `opened` and one label
# event per label fire almost together.
concurrency:
  group: renovate-auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # Human asked to review Renovate pull requests that do not merge themselves.
  # A repository variable rather than a name written here: it names a person.
  # Unset means "ask nobody"; the step below does nothing.
  DEFAULT_RENOVATE_REVIEWER: ${{ vars.DEFAULT_RENOVATE_REVIEWER }}

jobs:
  request-human-review:
    # Same-repo only: pull_request_target runs with base-repo permissions, and
    # an author login is not proof of where the head branch lives.
    # vars.RENOVATE_BOT_LOGIN is the Renovate account's login on this forge.
    if: >-
      ${{ vars.RENOVATE_BOT_LOGIN != '' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == vars.RENOVATE_BOT_LOGIN &&
          !contains(github.event.pull_request.labels.*.name, 'automerge') }}
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # The base branch's copy of the forge client; pull_request_target checks
      # out the base by default.
      - name: Checkout the forge client
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Request review from the default reviewer
        run: |
          set -euo pipefail
          # No configured reviewer is a valid setup, not an error.
          if [ -z "${DEFAULT_RENOVATE_REVIEWER:-}" ]; then
            echo "::notice::No DEFAULT_RENOVATE_REVIEWER variable set; not requesting a review."
            exit 0
          fi
          # Don't re-request someone who already reviewed: that would dismiss
          # their approval. Skip if they're already a requested reviewer too.
          REVIEWED=$(scripts/forge pr view "$PR" --json reviews \
            --jq "[.reviews[].author.login] | index(\"$DEFAULT_RENOVATE_REVIEWER\") // empty")
          REQUESTED=$(scripts/forge pr view "$PR" --json reviewRequests \
            --jq "[.reviewRequests[].login] | index(\"$DEFAULT_RENOVATE_REVIEWER\") // empty")
          if [ -z "$REVIEWED" ] && [ -z "$REQUESTED" ]; then
            scripts/forge pr edit "$PR" --add-reviewer "$DEFAULT_RENOVATE_REVIEWER" \
              || echo "::notice::Could not request review from $DEFAULT_RENOVATE_REVIEWER on PR #$PR; continuing."
          else
            echo "$DEFAULT_RENOVATE_REVIEWER already requested or has reviewed PR #$PR; not re-requesting."
          fi
