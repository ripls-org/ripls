name: Test Docker Build

# Supersede in-progress runs on the same ref (rapid pushes / reruns) so they
# don't stack on the shared self-hosted runners. See #2264.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yaml'
      - 'go.mod'
      - 'go.sum'
      - 'server/**'
      - '.github/compose/**'
      - '.github/workflows/test_docker_build.yaml'
  # No path filter on PRs: this is a required check, so it must report on every
  # PR. The `changes` job gates the real work — a PR that doesn't touch the
  # prod-image paths skips the `test-build` job, which reports success and
  # satisfies the required check (the GitHub-recommended pattern; #2287).
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detect Docker build changes
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'Dockerfile'
              - 'docker-compose.yaml'
              - 'go.mod'
              - 'go.sum'
              - 'server/**'
              - '.github/compose/**'
              - '.github/workflows/test_docker_build.yaml'

  test-build:
    needs: [changes]
    # Push/dispatch: always run. PR: run only when prod-image paths changed;
    # otherwise the job skips and reports success, satisfying the required check.
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    env:
      # The boot check runs the root docker-compose.yaml against the image built
      # below. A per-run project name keeps concurrent runs on the shared
      # self-hosted Docker host from touching each other's containers.
      SERVER_IMAGE: ripls-server:test
      COMPOSE_FILE: docker-compose.yaml:.github/compose/docker-compose.ci.yaml
      COMPOSE_PROJECT_NAME: ripls-compose-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fix git ownership (self-hosted runner)
        run: git config --global --add safe.directory '*'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test Docker build
        uses: docker/build-push-action@v7
        env:
          # Suppress the auto-uploaded build-record artifact (*.dockerbuild);
          # it ran on every PR and piled up ~1,600 artifacts in Actions storage.
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: false
          # Into the local daemon, so the compose boot below can run it.
          load: true
          tags: ripls-server:test
          cache-from: type=local,src=/tmp/docker-cache
          cache-to: type=local,dest=/tmp/docker-cache,mode=min

      # Proves the image boots with no cloud account: docker-compose.yaml reads
      # credentials from files and stores media locally. --wait returns once the
      # server's /readyz healthcheck passes, and fails if it never does.
      - name: Boot the image with docker compose
        run: docker compose up --no-build --wait --wait-timeout 180

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
