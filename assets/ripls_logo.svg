<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    6 sets of 3 concentric circles arranged in a circle
    Each set positioned 60° apart, starting at top (270° in standard coords)
    Overlapping such that inner touches outer and middle touches middle
  -->
  
  <!-- Define the concentric circle radii -->
  <!-- If center-to-center distance is D, and circles overlap as specified:
       - Inner radius (r1) touches outer radius (r3) of neighbor: D = r1 + r3
       - Middle radius (r2) touches middle radius (r2) of neighbor: D = 2*r2
       So: r1 + r3 = 2*r2, and we can choose r1=20, r2=40, r3=60 for nice proportions
       Center-to-center distance D = 80
  -->
  
  <defs>
    <style>
      .circle-stroke {
        fill: none;
        stroke-width: 5.5;
      }
      .blue {
        stroke: #3b5998;
      }
      .green {
        stroke: #84a178;
      }
    </style>
  </defs>
  
  <!-- Center of main circle -->
  <g transform="translate(160, 160)">
    <!-- Radius from center to each set's center -->
    <!-- With D=80 between adjacent sets, radius R = D/(2*sin(30°)) = 80 -->
    
    <!-- Draw green sets first (Sets 2, 4, 6) -->
    
    <!-- Set 2: 60° clockwise from top (330° = -30°) -->
    <g transform="translate(69.282, -40)">
      <circle cx="0" cy="0" r="20" class="circle-stroke green"/>
      <circle cx="0" cy="0" r="40" class="circle-stroke green"/>
      <circle cx="0" cy="0" r="60" class="circle-stroke green"/>
    </g>
    
    <!-- Set 4: Bottom (90°) -->
    <g transform="translate(0, 80)">
      <circle cx="0" cy="0" r="20" class="circle-stroke green"/>
      <circle cx="0" cy="0" r="40" class="circle-stroke green"/>
      <circle cx="0" cy="0" r="60" class="circle-stroke green"/>
    </g>
    
    <!-- Set 6: 300° clockwise from top (210°) -->
    <g transform="translate(-69.282, -40)">
      <circle cx="0" cy="0" r="20" class="circle-stroke green"/>
      <circle cx="0" cy="0" r="40" class="circle-stroke green"/>
      <circle cx="0" cy="0" r="60" class="circle-stroke green"/>
    </g>
    
    <!-- Draw blue sets on top (Sets 1, 3, 5) -->
    
    <!-- Set 1: Top (270° = -90° from right) -->
    <g transform="translate(0, -80)">
      <circle cx="0" cy="0" r="20" class="circle-stroke blue"/>
      <circle cx="0" cy="0" r="40" class="circle-stroke blue"/>
      <circle cx="0" cy="0" r="60" class="circle-stroke blue"/>
    </g>
    
    <!-- Set 3: 120° clockwise from top (30°) -->
    <g transform="translate(69.282, 40)">
      <circle cx="0" cy="0" r="20" class="circle-stroke blue"/>
      <circle cx="0" cy="0" r="40" class="circle-stroke blue"/>
      <circle cx="0" cy="0" r="60" class="circle-stroke blue"/>
    </g>
    
    <!-- Set 5: 240° clockwise from top (150°) -->
    <g transform="translate(-69.282, 40)">
      <circle cx="0" cy="0" r="20" class="circle-stroke blue"/>
      <circle cx="0" cy="0" r="40" class="circle-stroke blue"/>
      <circle cx="0" cy="0" r="60" class="circle-stroke blue"/>
    </g>
  </g>
</svg>
