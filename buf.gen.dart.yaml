# Controls Dart code generation for Buf.
# Only generates code from proto/ripls/api/ (excludes proto/ripls/models/).
version: v2
plugins:
  - remote: buf.build/connectrpc/dart:v1.0.0
    out: app/lib/data/gen
  - remote: buf.build/protocolbuffers/dart:v21.1.2
    out: app/lib/data/gen
    include_wkt: true
    include_imports: true
