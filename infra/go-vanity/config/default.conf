# Go module vanity-import host: serves go.ripls.org.
#
# One job: answer every request under this hostname with the same page, whose
# <meta name="go-import"> tag tells the Go toolchain where the source lives.
#
# The catch-all is not laziness. Resolving `go.ripls.org/ripls/server/storage`,
# the toolchain requests the FULL import path with ?go-get=1 — not just the
# module root — so the tag has to be served for every path beneath /ripls.
# Serving it for everything is the simplest way to be certain, and this host
# has nothing else to serve.

server {
    listen 80 default_server;
    server_name go.ripls.org;

    root /srv/content;

    # Every path, including ones that do not exist, gets the vanity page. No
    # 404s: a 404 to the go tool reads as "no such module".
    location / {
        try_files /index.html =500;
        default_type text/html;
    }

    # Nothing here is worth indexing, and the page is not a landing page.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The page is tiny and changes roughly never, but a stale cache would
    # outlive a forge move, so keep it short.
    add_header Cache-Control "public, max-age=300" always;
}
