# Staging server: routes <branch-slug>.staging.ripls.org to /srv/sites/<branch-slug>/.
# Each branch's content lives in its own subdirectory under /srv/sites/, populated
# by rsync from the deploy_staging_website.yaml workflow.
#
# This file is the FALLBACK, not the normal path. Every PR deploy also writes a
# site-<slug>.conf next to this file — an exact-hostname server block that
# includes that branch's own locations-<slug>.include. nginx prefers an exact
# server_name over a regex, so a deployed preview is served by its own block and
# its own routing, never by the rules below (#2895).
#
# The block below therefore only catches a preview whose directory exists but
# whose server block doesn't: one deployed before the per-branch split, or one
# caught mid-deploy. Its locations.include is production's routing, rsynced here
# by publish_website.yaml on merges to main.
#
# Deleting this block would be wrong even once every preview has its own: a
# stale sites/<slug>/ with no conf would fall through to the 404 catch-all with
# no hint that the preview needs a push to regenerate.

server {
    listen 80 default_server;
    server_name ~^(?<branch>[a-z0-9-]+)\.staging\.ripls\.org$;

    root /srv/sites/$branch;
    index index.html;

    # Tell crawlers to leave staging alone.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Revalidate every request. Without a Cache-Control header nginx sends only
    # ETag/Last-Modified, and browsers fall back to heuristic freshness — they
    # serve a preview from cache for a fraction of the file's age without
    # asking. A reviewer then sees a stale page after a deploy and has no way to
    # tell it apart from a deploy that didn't work. "no-cache" still permits a
    # 304, so this costs a conditional request, not a re-download.
    #
    # No location block in locations.include sets add_header, so both of these
    # are inherited by all of them (nginx drops inherited headers only at a
    # level that adds its own).
    add_header Cache-Control "no-cache" always;

    include /etc/nginx/conf.d/locations.include;
}

# Catch-all for hostnames whose branch directory isn't deployed.
server {
    listen 80;
    server_name ~^.*\.staging\.ripls\.org$;
    return 404;
}
