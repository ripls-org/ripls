// RPC service for managing communities.

syntax = "proto3";

package ripls.api;

import "ripls/api/user.proto";
import "ripls/api/gear.proto";
import "ripls/api/transfer.proto";
import "ripls/api/value.proto";
import "ripls/api/provisional_user.proto";
import "ripls/api/experience.proto";
import "ripls/api/gen_stream.proto";
import "ripls/api/common.proto";
import "ripls/api/profile_presence.proto";

option go_package = "go.ripls.org/ripls/server/gen/ripls/api;api";

// Request to create a new community.
message CreateCommunityRequest {
    // The name of the community.
    string name = 1;

    // A description of the community.
    string description = 2;

    // Optional media IDs for community images.
    repeated string media_ids = 3;

    // Optional: simulation run ID. When set, the created community is tagged for
    // later cleanup via CleanupSimulation. Dev mode only.
    optional string simulation_id = 4;
}

// Response after creating a community.
message CreateCommunityResponse {
    // The unique identifier of the created community.
    string id = 1;
}

// Request to get a community.
message GetCommunityRequest {
    // The unique identifier of the community to retrieve.
    string id = 1;
}

// Response containing community details.
message GetCommunityResponse {
    // The unique identifier of the community.
    string id = 1;

    // The name of the community.
    string name = 2;

    // A description of the community.
    string description = 3;

    // Optional media IDs for community images.
    repeated string media_ids = 4;

    // The current number of members in the community.
    int32 num_members = 5;

    // The maximum number of members allowed in the community.
    int32 max_members = 6;

    // The user who currently owns the community. The owner is the
    // only member who can delete the community; transferring
    // ownership through a leave-with-handoff updates this field.
    string owner_user_id = 7;
}

// Filter for regional community queries.
message RegionFilter {
    // Region ID to filter by (references models.Region).
    string region_id = 1;
}

// Request to list communities the user is a member of.
message ListCommunitiesRequest {
    // Optional: Filter communities by region.
    RegionFilter region_filter = 1;
}

// Response containing a list of communities.
message ListCommunitiesResponse {
    // The list of communities.
    repeated CommunityItem communities = 1;
}

// A single community item in a list.
message CommunityItem {
    // The unique identifier of the community.
    string id = 1;

    // The name of the community.
    string name = 2;

    // A description of the community.
    string description = 3;

    // Optional media IDs for community images.
    repeated string media_ids = 4;

    // The user who currently owns the community. The owner is the
    // only member who can delete the community; transferring
    // ownership through a leave-with-handoff updates this field.
    string owner_user_id = 5;

    // Total active members (including the owner). Used to render the
    // member count and, for ad-hoc (nameless) communities, to suppress
    // host-only ones and compute the "& N others" overflow. ListCommunities
    // omits host-only ad-hoc communities (name empty AND member_count <= 1)
    // entirely, so the clutter of per-item communities with no audience
    // never reaches the client (#2492).
    int32 member_count = 6;

    // First names of up to a few other members (excludes the requesting
    // user), so a nameless ad-hoc community can render like a group chat —
    // "Alex, Sam & 2 others" — instead of a blank name. Empty for named
    // communities (the client shows `name` instead).
    repeated string member_preview_first_names = 7;

    // For a nameless ad-hoc (per-item) community, the display name of the item
    // that spawned it (the experience name, gear name, or request title — for a
    // transfer, the gear's name), so the client can label it "Group from
    // {origin_item_name}". Empty for named communities and when the origin item
    // can't be resolved.
    string origin_item_name = 8;

    // The most recent activity time in the community (the latest community
    // event). Drives the directory's recency ordering and day grouping.
    // Absent when the community has no recorded activity yet.
    optional int64 last_activity_unix_sec = 9;

    // Latitude in degrees of a representative anchor point for where the
    // community's things live. Absent when none of the community's gear
    // has a location yet.
    optional double area_latitude_deg = 10;

    // Longitude in degrees of a representative anchor point for where the
    // community's things live. Absent when none of the community's gear
    // has a location yet.
    optional double area_longitude_deg = 11;

    // The number of things currently shared into the community.
    int32 gear_count = 12;
}

// Request to list the soft-deleted communities the caller is
// eligible to restore.
message ListDeletedCommunitiesForRestoreRequest {}

// Response containing the soft-deleted communities the caller is
// eligible to restore.
message ListDeletedCommunitiesForRestoreResponse {
    // Soft-deleted communities the caller may restore. Ordered
    // ascending by deleted_at_unix_sec — the oldest deletion is
    // closest to the 30-day purge boundary and listed first so
    // urgency is preserved on the client.
    repeated DeletedCommunityItem communities = 1;
}

// A soft-deleted community the caller is eligible to restore.
message DeletedCommunityItem {
    // The unique identifier of the community.
    string id = 1;

    // The name of the community.
    string name = 2;

    // A description of the community.
    string description = 3;

    // Optional media IDs for community images.
    repeated string media_ids = 4;

    // Unix timestamp (seconds) when the community was soft-deleted.
    // Clients render countdown UX from this + the 30-day window.
    int64 deleted_at_unix_sec = 5;

    // The user who deleted the community. Optional; the client
    // may surface a `Deleted by …` byline in the restore
    // confirmation.
    string deleted_by_user_id = 6;
}

// Request to list the active communities the caller can rejoin
// without a fresh invite.
message ListRejoinableCommunitiesRequest {}

// Response containing the active communities the caller can
// rejoin within the 30-day rejoin window.
message ListRejoinableCommunitiesResponse {
    // Active communities the caller may rejoin. Ordered
    // descending by left_at_unix_sec — most-recently-left first
    // since those are the most likely rejoin targets in the
    // user's mental model.
    repeated RejoinableCommunityItem communities = 1;
}

// An active community the caller can rejoin without a fresh
// invite within the 30-day window after they left.
message RejoinableCommunityItem {
    // The unique identifier of the community.
    string id = 1;

    // The name of the community.
    string name = 2;

    // A description of the community.
    string description = 3;

    // Optional media IDs for community images.
    repeated string media_ids = 4;

    // Unix timestamp (seconds) when the caller's CommunityUser
    // row was soft-deleted (i.e., when they left). Clients
    // render 'Left X days ago, Y days to rejoin' from this + the
    // 30-day rejoin window.
    int64 left_at_unix_sec = 5;
}

// Request to update a community.
message UpdateCommunityRequest {
    // The unique identifier of the community to update.
    string id = 1;

    // The name of the community (if updating).
    string name = 2;

    // A description of the community (if updating).
    string description = 3;

    // Optional media IDs for community images (if updating).
    repeated string media_ids = 4;
}

// Response after updating a community.
message UpdateCommunityResponse {}

// Request to delete a community.
message DeleteCommunityRequest {
    // The unique identifier of the community to delete.
    string id = 1;
}

// Response after deleting a community.
message DeleteCommunityResponse {}

// Request to find a background image for a community from a description prompt.
message GenCommunityRequest {
    // The community's name/description text, used to find a relevant background image.
    string prompt = 1;

    // Optional: User's preferred region/location for context (e.g., "Boulder, CO").
    string region = 2;
}

// Background-image suggestion for a community being created (NOT saved to the
// database). Carries the stock image(s) found for the community; the client
// supplies the community name and description itself. The client previews
// these and calls CreateCommunity to persist.
message GenCommunityResponse {
    // Field numbers 1, 2, 4, 5 previously carried an AI-generated title,
    // description, confidence, and reasoning. Community creation no longer
    // generates text, so they were removed and must not be reused.
    reserved 1, 2, 4, 5;
    reserved "title", "description", "confidence", "reasoning";

    // Media IDs for the suggested background image(s) (images ARE saved for later use).
    repeated string media_ids = 3;
}

// Request to find a background image for a community via an incremental
// event stream, keyed on the community's name/description text.
message StreamGenCommunityRequest {
    // Field number 3 previously carried an image-mode `media_id` input that
    // derived the community from an uploaded image. Removed; must not be reused.
    reserved 3;
    reserved "media_id";

    // The community's name (and optionally description) text, used to find a
    // relevant background image.
    string prompt = 1;

    // Optional: User's preferred region/location for context (e.g., "Boulder, CO").
    string region = 2;
}

// One event in a StreamGenCommunity stream. Terminated by exactly one of
// `final` or `error`. The non-terminal `media_ready` event may arrive before
// the terminal event. Field numbers reflect introduction order and must not
// be reused.
message StreamGenCommunityResponse {
    // Field numbers 1 and 2 previously carried `title` and `description`
    // events. Community creation no longer generates text, so they were
    // removed and must not be reused.
    reserved 1, 2;
    reserved "title", "description";

    oneof event {
        // The background image selected for the community.
        MediaReady media_ready = 3;
        // Terminal: the suggested background image(s) for the community.
        GenCommunityResponse final = 4;
        // Terminal alternative.
        GenStreamError error = 5;
    }
}

// GetOrCreateInviteLinkRequest / GetOrCreateInviteLinkResponse were removed in
// #2058. Use GetOrCreateShareLink with a community_invite target instead.

// Request to revoke a shareable link by its short code.
message RevokeShareLinkRequest {
    // The raw short code identifying the link to revoke. The caller
    // must be the link's inviter.
    string short_code = 1;
}

// Response after revoking a shareable link.
message RevokeShareLinkResponse {}

// Request to accept an invitation link for an already logged-in user.
message AcceptInvitationLinkRequest {
  // The invitation short code from the link.
  string short_code = 1;

  // Field 2 (gear_id) removed in #2562. Legacy invite URLs carried gear
  // context as a `?gear_id=` query param passed through here for the
  // audit record; the deep-link target now travels with the share link
  // itself.
  reserved 2;
  reserved "gear_id";
}

// Response after accepting an invitation link.
message AcceptInvitationLinkResponse {
  // The community the user was added to.
  string community_id = 1;

  // Name of the community for display.
  string community_name = 2;
}

// Request to get or create a shareable link.
message GetOrCreateShareLinkRequest {
  // The community the share link is scoped to. The caller must be an
  // active member of this community.
  string community_id = 1;

  // Identifies what the link should point at. Exactly one variant
  // must be set. Item-scoped variants require the target to be
  // shared with the named community.
  oneof target {
    // The link points at the community itself (plain "join this
    // community" invite).
    string community_invite = 2;
    // The link points at a specific gear item.
    string gear_id = 3;
    // The link points at a specific transfer (loan or giveaway).
    string transfer_id = 4;
    // The link points at a specific request.
    string request_id = 5;
    // The link points at a specific event.
    string experience_id = 6;
  }
}

// Response after getting or creating a shareable link.
message GetOrCreateShareLinkResponse {
  // Full URL of the share link, e.g.
  // "https://ripls.app/go/Xk9mN2pQ".
  string share_url = 1;

  // The raw short code identifying the link.
  string short_code = 2;

  // The community the link is scoped to.
  string community_id = 3;

  // The current number of members in the community. Bundled here so
  // share-sheet UIs can show "X of Y members" without a separate RPC.
  int32 num_members = 4;

  // The maximum number of members allowed in the community.
  int32 max_members = 5;
}

// Request to leave a community.
message LeaveCommunityRequest {
    // The unique identifier of the community to leave.
    string community_id = 1;

    // When the calling user is the community's owner, this picks the
    // member who will receive ownership at the moment the leaver's
    // membership is removed. Required for owner-leave; ignored for
    // non-owner leaves. Sole-member-leave converts to delete in the
    // server and does not need this field.
    optional string new_owner_user_id = 2;
}

// Response after leaving a community.
message LeaveCommunityResponse {}

// Request to restore a previously soft-deleted community. The caller
// must have been an active member at the moment the community was
// deleted. The restorer becomes the new owner.
message RestoreCommunityRequest {
    // The unique identifier of the community to restore.
    string community_id = 1;
}

// Response after restoring a community.
message RestoreCommunityResponse {}

// Request to rejoin a community the caller previously left, within
// the 30-day rejoin window. No invite required.
message RejoinCommunityRequest {
    // The unique identifier of the community to rejoin.
    string community_id = 1;
}

// Response after rejoining a community.
message RejoinCommunityResponse {}

// Request to list gear shared with a community.
message ListCommunityGearRequest {
    // The unique identifier of the community.
    string community_id = 1;
}

// Response containing a list of gear shared with the community.
message ListCommunityGearResponse {
    // The list of gear items shared with the community.
    repeated CommunityGearItem gear_items = 1;
}

// A single gear item shared with a community.
message CommunityGearItem {
    // A unique identifier for the gear.
    string id = 1;

    // The name of the gear.
    string name = 2;

    // A description of the gear.
    string description = 3;

    // The user who owns this gear.
    User owner = 4;

    // Whether this gear is available for loan or giveaway in this community.
    Availability availability = 5;

    // Media items associated with this gear.
    repeated string media_ids = 6;

    // The location where this gear is stored.
    string location_id = 7;

    // Latitude in degrees, range [-90, 90].
    double latitude_deg = 8;

    // Longitude in degrees, range [-180, 180].
    double longitude_deg = 9;

    // Active loan information, if gear is currently on loan.
    optional ActiveLoan active_loan = 10;

    // Conversation ID for this gear in its community context.
    // This is a perpetual, community-wide discussion about the gear item.
    string conversation_id = 11;

    // Value estimate for this gear item.
    // Contains estimated value, confidence, and reasoning.
    ValueEstimate value_estimate = 12;
}

// Request to update gear sharing settings.
message UpdateGearSharingRequest {
    // The unique identifier of the gear.
    string gear_id = 1;

    // The unique identifier of the community.
    string community_id = 2;

    // Updated availability setting.
    Availability availability = 3;
}

// Response after updating gear sharing.
message UpdateGearSharingResponse {}

// Request to set an item of gear's availability (loan vs giveaway) across every
// community it is shared with. Where UpdateGearSharing changes one community's
// setting, this changes the item's mode everywhere at once: an item is lent or
// given away as a whole, not community by community.
message SetGearAvailabilityRequest {
    // The unique identifier of the gear whose availability to set.
    string gear_id = 1;

    // The availability to apply to the gear in every community it is shared with.
    Availability availability = 2;
}

// Response after setting gear availability.
message SetGearAvailabilityResponse {}

// Request to list completed giveaways in a community.
message ListCompletedGiveawaysRequest {
    // The unique identifier of the community.
    string community_id = 1;
}

// Response containing a list of completed giveaways in the community.
message ListCompletedGiveawaysResponse {
    // The list of gear items that were given away in this community.
    repeated CommunityGearItem gear_items = 1;
}

// Request to list users in a community.
message ListCommunityUsersRequest {
    // The unique identifier of the community.
    string community_id = 1;
}

// CommunityMember pairs a User with their community membership metadata.
message CommunityMember {
    // The user's profile information.
    User user = 1;

    // When the user joined the community (Unix timestamp in seconds).
    int64 joined_at_unix_sec = 2;
}

// Response containing a list of users in the community.
message ListCommunityUsersResponse {
    // The list of members in the community, each paired with membership metadata.
    repeated CommunityMember members = 1;
}

// Request to create a provisional user (placeholder for a non-registered participant).
// Provisional users are scoped to a community and do not count toward the member limit.
message CreateProvisionalUserRequest {
    // The community to create the provisional user in.
    string community_id = 1;

    // Display name for the provisional user (e.g. "Mike" or "Bhavna Singh").
    string name = 2;

    // Optional off-app contact handle, making this a contact-keyed provisional
    // member reachable by text or email. At most one may be set; both absent
    // creates a name-only provisional user. The server normalizes (E.164 phone /
    // lowercased email) and dedups one provisional member per handle per
    // community. The value is never returned in any response (PII).
    oneof contact {
        // E.164 or loosely-formatted phone number; normalized server-side.
        string phone_number = 3;

        // Email address; normalized server-side.
        string email = 4;
    }
}

// Response after creating a provisional user.
message CreateProvisionalUserResponse {
    // The created provisional user.
    ProvisionalUser provisional_user = 1;
}

// Request to list provisional users in a community.
message ListProvisionalUsersRequest {
    // The community to list provisional users for.
    string community_id = 1;
}

// Response containing provisional users in a community.
message ListProvisionalUsersResponse {
    // Provisional users in the community (both claimed and unclaimed).
    repeated ProvisionalUser provisional_users = 1;
}

// Request to search provisional users in a community by name.
message SearchProvisionalUsersRequest {
    // The community to search in.
    string community_id = 1;

    // Name query (ILIKE match against provisional user display names).
    string query = 2;

    // Maximum number of results to return (default 10, max 50).
    int32 limit = 3;
}

// Response containing matched provisional users.
message SearchProvisionalUsersResponse {
    // Provisional users whose names match the query.
    repeated ProvisionalUser provisional_users = 1;
}

// Request to generate an invite link for a provisional user so they can claim their account.
message GetProvisionalUserInviteLinkRequest {
    // The community the provisional user belongs to.
    string community_id = 1;

    // The ID of the provisional user to generate an invite link for.
    string provisional_user_id = 2;
}

// Response containing the invite link for a provisional user.
message GetProvisionalUserInviteLinkResponse {
    // Short code for the invitation link.
    string short_code = 1;

    // Full invite URL (e.g. https://ripls.app/go/Xk9mN2pQ).
    string invite_url = 2;
}

// Request to share an item with communities and/or invite individuals to it —
// the single audience-management entry point across all item types. Supply the
// item id plus any combination of: existing communities to share with, app
// members to add, and off-app contacts (phone/email) to invite. When any
// individuals are invited, the server provisions a nameless ad-hoc community
// whose audience is those people, adds member invitees directly, creates
// provisional members for phone/email handles, mints a shareable open link,
// sends email invites immediately, and persists the host's consent. Phone
// invitees are host-relayed by the client via the returned share_url, not
// platform-texted. Supersedes the per-type ShareExperience / ShareGear /
// ShareRequest add-paths (see issue #2526). A future UnshareItem will be the
// uniform counterpart for removing audience.
//
// Permissions are tiered (#2630): a call with no invitees and no
// share_to_community_ids only resolves the item's community and open share
// link, and is allowed for any member of a community the item is shared with
// (or the owner) — any member may reshare the link. A call that mutates the
// audience (any invitees or share_to_community_ids) requires the item's owner.
message ShareItemRequest {
    // The item to provision an audience for. Exactly one must be set.
    oneof item {
        string experience_id = 1;
        string gear_id = 2;
        string request_id = 3;
        string transfer_id = 4;
    }

    // People to invite. Member invitees join the ad-hoc community directly;
    // phone/email invitees become provisional members notified off-app. May be
    // empty when only sharing to existing communities.
    repeated Invitee invitees = 5;

    // Host attestation, required when any phone invitee is present.
    optional HostInviteConsent invite_consent = 6;

    // Existing communities to also share this item with (additive; independent
    // of the invited ad-hoc audience). May be empty.
    repeated string share_to_community_ids = 7;
}

// Response with the provisioned audience and its shareable link.
message ShareItemResponse {
    // The nameless ad-hoc community provisioned for the invited audience.
    // Absent when no individuals were invited (only existing-community sharing).
    optional string adhoc_community_id = 1;

    // Shareable open link for the ad-hoc community; the client uses it to
    // host-relay phone invites (pre-filled text) and to offer copy/share.
    // Absent when no ad-hoc community was provisioned.
    optional string share_url = 2;

    // Whether the caller may manage this item's audience (invite people, add
    // communities). False for members who may only reshare the open link.
    optional bool can_manage_audience = 3;
}

// Request to remove an item from one community's audience — the uniform
// remove-path counterpart to ShareItem, across all item types. Supply the item
// id and the community to remove it from. Owner-only. Supersedes the per-type
// UnshareExperience / UnshareGear / UnshareRequest remove-paths (issue #2526).
// Per-type removal semantics are preserved: a request cannot be removed from its
// last community, and each type's audience event/soft-vs-hard removal is
// unchanged.
message UnshareItemRequest {
    // The item to remove from a community. Exactly one must be set.
    oneof item {
        string experience_id = 1;
        string gear_id = 2;
        string request_id = 3;
        string transfer_id = 4;
    }

    // The community to remove the item from.
    string community_id = 5;
}

// Response after removing an item from a community.
message UnshareItemResponse {}

// Request to search community members by name (fuzzy / ILIKE matching).
// Used to resolve AI-extracted participant names to real user accounts.
message SearchCommunityUsersRequest {
    // The unique identifier of the community.
    string community_id = 1;

    // The name query to search for (ILIKE match against display names).
    string query = 2;

    // Maximum number of results to return (default 10, max 50).
    int32 limit = 3;
}

// Response containing matched community users.
message SearchCommunityUsersResponse {
    // Users whose display names match the query.
    repeated User users = 1;
}

// Types of events that can occur within a community.
enum CommunityEventType {
    COMMUNITY_EVENT_TYPE_UNSPECIFIED = 0;
    COMMUNITY_EVENT_TYPE_INVITATION_LINK_USED = 1;
    COMMUNITY_EVENT_TYPE_GEAR_SHARED = 2;
    COMMUNITY_EVENT_TYPE_GEAR_UNSHARED = 3;
    COMMUNITY_EVENT_TYPE_MEMBER_LEFT = 4;
    reserved 5;
    COMMUNITY_EVENT_TYPE_TRANSFER_INTEREST_EXPRESSED = 6;
    COMMUNITY_EVENT_TYPE_TRANSFER_RECIPIENT_SELECTED = 7;
    COMMUNITY_EVENT_TYPE_TRANSFER_ACTIVE = 8;
    COMMUNITY_EVENT_TYPE_TRANSFER_COMPLETED = 9;
    COMMUNITY_EVENT_TYPE_REQUEST_CREATED = 10;
    COMMUNITY_EVENT_TYPE_REQUEST_FULFILLED = 11;
    COMMUNITY_EVENT_TYPE_REQUEST_OFFER_MADE = 12;
    COMMUNITY_EVENT_TYPE_REQUEST_OFFER_SELECTED = 13;
    COMMUNITY_EVENT_TYPE_REQUEST_CANCELLED = 14;
    COMMUNITY_EVENT_TYPE_COMMUNITY_CREATED = 15;
    COMMUNITY_EVENT_TYPE_TRANSFER_INTEREST_WITHDRAWN = 16;
    COMMUNITY_EVENT_TYPE_REQUEST_OFFER_WITHDRAWN = 17;
    COMMUNITY_EVENT_TYPE_EXPERIENCE_CREATED = 18;
    COMMUNITY_EVENT_TYPE_TRANSFER_CANCELLED = 19;
    COMMUNITY_EVENT_TYPE_EXPERIENCE_RSVP_YES = 20;
    COMMUNITY_EVENT_TYPE_EXPERIENCE_RSVP_MAYBE = 21;
    COMMUNITY_EVENT_TYPE_EXPERIENCE_RSVP_NO = 22;
    COMMUNITY_EVENT_TYPE_TRANSFER_PICKUP_PROPOSED = 23;

    // Host-driven roster change (reset-to-invited / remove member, or a
    // sibling-community fan-out) streamed only to refresh open rosters. Not
    // in the notification allow-list, so it never pushes (#2492). Mirrors
    // models.CommunityEventType so the direct numeric cast in streaming.go
    // stays meaningful.
    COMMUNITY_EVENT_TYPE_EXPERIENCE_ROSTER_CHANGED = 47;

    // Planning collaborative-list changes (needs added/removed/claimed/
    // updated, contributions added/removed), scoped to an Experience or a
    // Request via the event topic. Streamed/polled so an open roster's needs
    // strip and per-person claim pills refresh live (#2724); push delivery is
    // separately gated by the notification allow-list. Values mirror
    // models.CommunityEventType so the by-name conversion stays lossless.
    COMMUNITY_EVENT_TYPE_PLANNING_NEED_ADDED = 24;
    COMMUNITY_EVENT_TYPE_PLANNING_NEED_REMOVED = 25;
    COMMUNITY_EVENT_TYPE_PLANNING_NEED_CLAIMED = 26;
    COMMUNITY_EVENT_TYPE_PLANNING_CONTRIBUTION_ADDED = 27;
    COMMUNITY_EVENT_TYPE_PLANNING_CONTRIBUTION_REMOVED = 28;
    COMMUNITY_EVENT_TYPE_PLANNING_NEED_UPDATED = 45;

    // Lifecycle transitions on an Experience that ping Yes/Maybe RSVPs
    // (gated by notify_experience_rsvps). STARTED fires when the owner marks
    // the experience in-process; CANCELLED fires when the owner cancels it.
    COMMUNITY_EVENT_TYPE_EXPERIENCE_STARTED = 38;
    COMMUNITY_EVENT_TYPE_EXPERIENCE_CANCELLED = 39;

    // Community soft-delete lifecycle. Actor on COMMUNITY_DELETED is
    // the member who triggered the delete; actor on COMMUNITY_RESTORED
    // is the restorer (and the new owner).
    COMMUNITY_EVENT_TYPE_COMMUNITY_DELETED = 40;
    COMMUNITY_EVENT_TYPE_COMMUNITY_RESTORED = 41;

    // Ownership transferred from one member to another. Actor is the
    // previous owner; the new owner is named via object_user.
    COMMUNITY_EVENT_TYPE_OWNERSHIP_TRANSFERRED = 42;

    // A previously-departed member rejoined within the 30-day rejoin
    // window without needing a fresh invite. Actor is the rejoiner.
    COMMUNITY_EVENT_TYPE_MEMBER_REJOINED_WITHIN_WINDOW = 43;

    // An ad-hoc (nameless) community was promoted to a real persistent one
    // by gaining a name (#2492). Actor is the member who named it. Mirrors
    // models.CommunityEventType so the direct numeric cast in events.go /
    // streaming.go stays meaningful.
    COMMUNITY_EVENT_TYPE_COMMUNITY_NAMED = 46;
}

// Request to list events for a community.
message ListCommunityEventsRequest {
    // The unique identifier of the community.
    string community_id = 1;

    // Optional: Filter by event types. If empty, returns all event types.
    repeated CommunityEventType event_types = 2;

    // Optional: Only return events newer than this timestamp (Unix seconds).
    // Server caps at 7 days ago to prevent huge backlogs for dormant users.
    optional int64 since_unix_sec = 3;
}

// Response containing a list of community events.
message ListCommunityEventsResponse {
    // The list of events in the community.
    repeated CommunityEventItem events = 1;
}

// Request to stream every event across all of the caller's communities on a
// single connection.
//
// The caller's communities are resolved server-side from live membership on
// each event, so joining or leaving one takes effect without reopening the
// stream — there is no community list to keep in sync, and no per-community
// subscribe call.
message StreamUserEventsRequest {
    // Optional: When set, the stream begins by replaying all events across the
    // caller's communities that occurred after this timestamp (capped at 7 days
    // ago), then continues streaming new events. When omitted, no catch-up
    // replay is performed and only new events are streamed.
    optional int64 since_unix_sec = 1;
}

// Response containing a single streamed event or a liveness signal.
message StreamUserEventsResponse {
    // Exactly one of `event` or `heartbeat` is set.
    oneof payload {
        // An event that occurred in one of the caller's communities. Which one
        // is on the item's `community_id` — unlike the per-community stream,
        // the recipient cannot infer it from the subscription.
        CommunityEventItem event = 1;

        // A periodic liveness signal. Clients may ignore this message; its
        // presence indicates the subscription is healthy.
        Heartbeat heartbeat = 2;
    }
}

// Request for the poll backstop across all of the caller's communities.
message ListUserEventsRequest {
    // Optional: Only return events newer than this timestamp (Unix seconds).
    // Server caps at 7 days ago to prevent huge backlogs for dormant users.
    optional int64 since_unix_sec = 1;
}

// Response containing recent events across all of the caller's communities.
message ListUserEventsResponse {
    // Events across every community the caller belongs to, oldest first. The
    // server bounds the count; a client that receives exactly the maximum
    // should assume older events were dropped and treat its local state as
    // needing a full refresh rather than an incremental one.
    repeated CommunityEventItem events = 1;
}

// A liveness signal sent on an otherwise-idle event stream. Carries no
// payload — its arrival is the signal.
message Heartbeat {}

// A single event in a community.
message CommunityEventItem {
    // The unique identifier of the event.
    string id = 1;

    // The unique identifier of the community.
    string community_id = 2;

    // The type of event that occurred.
    CommunityEventType event_type = 3;

    // The user who triggered this event.
    User actor = 4;

    // Optional: The user who was the object of this event.
    User object_user = 6;

    // Optional: The unique identifier of the gear involved in this event.
    string gear_id = 8;

    // Optional: The name of the gear involved in this event.
    string gear_name = 9;

    // Optional: The unique identifier of the transfer involved in this event.
    string transfer_id = 10;

    // Optional: The type of transfer for transfer-related events (loan, giveaway, etc).
    TransferType transfer_type = 11;

    // When this event occurred (Unix timestamp in seconds).
    int64 occurred_at_unix_sec = 12;
}

// Request to list regions associated with a community.
message ListCommunityRegionsRequest {
    // The unique identifier of the community.
    string community_id = 1;
}

// Response with list of regions.
message ListCommunityRegionsResponse {
    // The list of regions associated with the community.
    repeated CommunityRegionItem regions = 1;
}

// A single region association for a community.
message CommunityRegionItem {
    // Region ID (references models.Region).
    string region_id = 1;

    // Percentage of community members in this region (0.0 - 1.0).
    double member_percentage = 2;

    // True if manually set, false if auto-computed.
    bool is_override = 3;
}

// Request to manually override a community's region.
message SetCommunityRegionOverrideRequest {
    // The unique identifier of the community to update.
    string community_id = 1;

    // Region ID to set (references models.Region).
    string region_id = 2;
}

// Response after setting region override.
message SetCommunityRegionOverrideResponse {}

// Request to get activities a provisional user participated in.
message GetProvisionalUserActivitiesRequest {
    // The community the provisional user belongs to.
    string community_id = 1;

    // The ID of the provisional user.
    string provisional_user_id = 2;

    // Maximum number of activities to return (default 20, max 50).
    int32 limit = 3;
}

// An activity entry for a provisional user's participation history.
message ProvisionalUserActivityItem {
    // The experience the provisional user attended.
    Experience experience = 1;

    // Unix timestamp when the experience was completed.
    int64 completed_at_unix_sec = 2;
}

// Response containing the provisional user's activity history and impact metrics.
message GetProvisionalUserActivitiesResponse {
    // Experiences the provisional user participated in, most recent first.
    repeated ProvisionalUserActivityItem activities = 1;

    // Total number of activities the provisional user has participated in.
    int32 total_activity_count = 2;
}

// Per-community push-notification preferences. Every field is optional;
// a missing field means the category is enabled. Clients should treat
// any unset toggle as "on".
message CommunityNotificationPreferences {
    // Notify on new requests posted to the community.
    optional bool notify_new_requests = 1;

    // Notify on new experiences posted to the community.
    optional bool notify_new_experiences = 2;

    // Notify when gear is shared into the community.
    optional bool notify_gear_shared = 3;

    // Notify when an experience is marked completed.
    optional bool notify_experience_completed = 4;

    // Notify on transfer-lifecycle events for transfers the user is a
    // party to.
    optional bool notify_transfer_updates = 5;

    // Notify on request-lifecycle events for requests the user is a
    // party to.
    optional bool notify_request_updates = 6;

    // Notify on RSVPs to experiences the user hosts and on lifecycle
    // updates for experiences the user RSVP'd yes/maybe to.
    optional bool notify_experience_rsvps = 7;

    // Notify on planning activity for experiences the user RSVP'd
    // yes/maybe to.
    optional bool notify_planning_updates = 8;

    // Notify on chat messages in conversations scoped to this community.
    optional bool notify_chats = 9;

    // Notify when a new member joins the community.
    optional bool notify_new_members = 10;

    // Notify the user with scheduled reminders ahead of Experiences
    // they have RSVPed yes/maybe to (24h before, 2h before, starting).
    optional bool notify_event_reminders = 11;

    // Prompt the requester every 3 days to mark still-open requests
    // fulfilled or cancelled. Unset = on.
    optional bool notify_request_followup_prompts = 12;
}

// Request to read the calling user's notification preferences for a
// community.
message GetCommunityNotificationPreferencesRequest {
    // The community whose preferences to read.
    string community_id = 1;
}

// Response containing the calling user's notification preferences. Any
// toggle the user has not explicitly disabled comes back unset; clients
// must treat unset as enabled.
message GetCommunityNotificationPreferencesResponse {
    // The user's preferences for this community.
    CommunityNotificationPreferences preferences = 1;
}

// Request to update the calling user's notification preferences for a
// community. Upserts; only fields present on `preferences` are written.
message UpdateCommunityNotificationPreferencesRequest {
    // The community whose preferences to update.
    string community_id = 1;

    // The full preferences message to persist for this user.
    CommunityNotificationPreferences preferences = 2;
}

// Response after updating notification preferences.
message UpdateCommunityNotificationPreferencesResponse {
    // The persisted preferences as they will be applied for future events.
    CommunityNotificationPreferences preferences = 1;
}

// Request for the presence read that selects the community profile
// sheet's content for the calling member.
message GetCommunityPresenceForViewerRequest {
    // Identifier of the community whose profile sheet is being
    // assembled. The caller must be an active member.
    string community_id = 1;
}

// Response carrying the server-selected sheet state for the community
// profile. Priority rule: the soonest-deadline open ask holds the
// sheet; ties go to the longest-unclaimed ask; the rest are queued.
// With no qualifying ask, the next upcoming community event holds the
// sheet; else quiet.
message GetCommunityPresenceForViewerResponse {
    // Which sheet state was selected. Cold start does not apply to
    // communities; kinds are ACTIVE_ASK, NEXT_EVENT, or QUIET.
    ProfileSheetKind sheet_kind = 1;

    // The winning open ask. Present iff [sheet_kind] is ACTIVE_ASK.
    optional ProfileAskCard active_ask = 2;

    // The next upcoming community event. Present iff [sheet_kind] is
    // NEXT_EVENT.
    optional ProfileEventCard next_event = 3;

    // Asks that qualified but lost the priority contest, soonest
    // first — named in the sheet's peek row and kept claimable in the
    // open list. Empty unless [sheet_kind] is ACTIVE_ASK.
    repeated ProfileQueuedAsk queued_asks = 4;
}

// RPC service for managing communities.
service CommunityService {
    // Create a new community.
    rpc CreateCommunity(CreateCommunityRequest) returns (CreateCommunityResponse);

    // Find a relevant background image for a community from a description
    // prompt. Does not save anything; the client supplies name/description
    // and calls CreateCommunity to persist.
    rpc GenCommunity(GenCommunityRequest) returns (GenCommunityResponse);

    // Streaming variant of GenCommunity. Same inputs, same final shape;
    // emits a media_ready event when a background image is found.
    rpc StreamGenCommunity(StreamGenCommunityRequest) returns (stream StreamGenCommunityResponse);

    // Get a community by ID.
    rpc GetCommunity(GetCommunityRequest) returns (GetCommunityResponse);

    // Get the server-selected pinned-sheet state for the community
    // profile: the community's most pressing open ask (soonest
    // deadline; ties to longest-unclaimed; the rest queued), else the
    // next upcoming community event, else quiet. Caller must be an
    // active member.
    rpc GetCommunityPresenceForViewer(GetCommunityPresenceForViewerRequest) returns (GetCommunityPresenceForViewerResponse);

    // List communities.
    rpc ListCommunities(ListCommunitiesRequest) returns (ListCommunitiesResponse);

    // List soft-deleted communities the caller is eligible to
    // restore. Eligibility is membership in the community at the
    // moment it was deleted (the snapshot captured by
    // DeleteCommunity). Used by the Settings → Communities
    // deleted-list surface.
    rpc ListDeletedCommunitiesForRestore(ListDeletedCommunitiesForRestoreRequest) returns (ListDeletedCommunitiesForRestoreResponse);

    // List active communities the caller can rejoin without a
    // fresh invite — i.e., the caller has a soft-deleted
    // CommunityUser row less than 30 days old AND the community
    // itself is still active. Used by the Settings → Communities
    // recently-left surface.
    rpc ListRejoinableCommunities(ListRejoinableCommunitiesRequest) returns (ListRejoinableCommunitiesResponse);

    // Update a community.
    rpc UpdateCommunity(UpdateCommunityRequest) returns (UpdateCommunityResponse);

    // Delete a community.
    rpc DeleteCommunity(DeleteCommunityRequest) returns (DeleteCommunityResponse);

    // Get or create a shareable link. The target oneof identifies
    // what the link points at; one link per (caller, target);
    // reusable until revoked.
    rpc GetOrCreateShareLink(GetOrCreateShareLinkRequest) returns (GetOrCreateShareLinkResponse);

    // Revoke a shareable link. Caller must be the link's inviter.
    // Idempotent — re-revoking an already-revoked link returns success.
    rpc RevokeShareLink(RevokeShareLinkRequest) returns (RevokeShareLinkResponse);

    // GetOrCreateInviteLink was removed in #2058 — superseded by
    // GetOrCreateShareLink with a community_invite target.

    // Accept an invitation link (for already logged-in users).
    rpc AcceptInvitationLink(AcceptInvitationLinkRequest) returns (AcceptInvitationLinkResponse);

    // Leave a community.
    rpc LeaveCommunity(LeaveCommunityRequest) returns (LeaveCommunityResponse);

    // Restore a previously soft-deleted community. The caller must have
    // been an active member at delete time; the restorer becomes the
    // new owner.
    rpc RestoreCommunity(RestoreCommunityRequest) returns (RestoreCommunityResponse);

    // Rejoin a community the caller left, within the 30-day rejoin
    // window. No invite required.
    rpc RejoinCommunity(RejoinCommunityRequest) returns (RejoinCommunityResponse);

    // List gear shared with a community.
    rpc ListCommunityGear(ListCommunityGearRequest) returns (ListCommunityGearResponse);

    // Update gear sharing settings.
    rpc UpdateGearSharing(UpdateGearSharingRequest) returns (UpdateGearSharingResponse);

    // Set an item's availability (loan vs giveaway) across every community it is
    // shared with. Rejected while the item has an in-progress loan or giveaway.
    rpc SetGearAvailability(SetGearAvailabilityRequest) returns (SetGearAvailabilityResponse);

    // List completed giveaways in a community.
    rpc ListCompletedGiveaways(ListCompletedGiveawaysRequest) returns (ListCompletedGiveawaysResponse);

    // List users in a community.
    rpc ListCommunityUsers(ListCommunityUsersRequest) returns (ListCommunityUsersResponse);

    // Search community members by name (fuzzy ILIKE matching).
    // Used to resolve AI-extracted participant names to real user accounts.
    rpc SearchCommunityUsers(SearchCommunityUsersRequest) returns (SearchCommunityUsersResponse);

    // List events in a community.
    rpc ListCommunityEvents(ListCommunityEventsRequest) returns (ListCommunityEventsResponse);

    // Open the caller's single realtime stream, and its poll backstop.
    rpc StreamUserEvents(StreamUserEventsRequest) returns (stream StreamUserEventsResponse);
    rpc ListUserEvents(ListUserEventsRequest) returns (ListUserEventsResponse);

    // List regions associated with a community.
    rpc ListCommunityRegions(ListCommunityRegionsRequest) returns (ListCommunityRegionsResponse);

    // Manually override a community's region (for new communities or special cases).
    rpc SetCommunityRegionOverride(SetCommunityRegionOverrideRequest) returns (SetCommunityRegionOverrideResponse);

    // Create a provisional user (lightweight placeholder for a non-registered participant).
    rpc CreateProvisionalUser(CreateProvisionalUserRequest) returns (CreateProvisionalUserResponse);

    // List provisional users in a community.
    rpc ListProvisionalUsers(ListProvisionalUsersRequest) returns (ListProvisionalUsersResponse);

    // Search provisional users in a community by name.
    rpc SearchProvisionalUsers(SearchProvisionalUsersRequest) returns (SearchProvisionalUsersResponse);

    // Get or create an invite link for a provisional user to claim their account.
    rpc GetProvisionalUserInviteLink(GetProvisionalUserInviteLinkRequest) returns (GetProvisionalUserInviteLinkResponse);

    // Share an item with communities and/or invite individuals to it — the
    // single audience-management entry point for all item types. Provisions the
    // ad-hoc audience community, attaches member and provisional invitees, mints
    // the open link, sends email invites, and persists host consent. Supersedes
    // ShareExperience / ShareGear / ShareRequest (issue #2526).
    rpc ShareItem(ShareItemRequest) returns (ShareItemResponse);

    // Remove an item from a community's audience — the uniform remove-path
    // counterpart to ShareItem for all item types. Owner-only; preserves the
    // per-type removal semantics (a request cannot leave its last community).
    // Supersedes UnshareExperience / UnshareGear / UnshareRequest (issue #2526).
    rpc UnshareItem(UnshareItemRequest) returns (UnshareItemResponse);

    // Get the activities (experiences) a provisional user has participated in,
    // along with aggregated impact metrics.
    rpc GetProvisionalUserActivities(GetProvisionalUserActivitiesRequest) returns (GetProvisionalUserActivitiesResponse);

    // Read the calling user's per-category notification preferences for a
    // community. Unset toggles in the response mean the category is enabled.
    rpc GetCommunityNotificationPreferences(GetCommunityNotificationPreferencesRequest) returns (GetCommunityNotificationPreferencesResponse);

    // Update the calling user's per-category notification preferences for a
    // community. Upsert by (user, community).
    rpc UpdateCommunityNotificationPreferences(UpdateCommunityNotificationPreferencesRequest) returns (UpdateCommunityNotificationPreferencesResponse);
}