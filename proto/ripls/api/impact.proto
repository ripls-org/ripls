// Impact metrics types for API responses.

syntax = "proto3";

package ripls.api;

import "ripls/api/common.proto";

option go_package = "go.ripls.org/ripls/server/gen/ripls/api;api";

// CommunityImpactMetrics represents the overall impact and reciprocity metrics
// for a community. Used to display the "Ripple Multiplier" score card.
message CommunityImpactMetrics {
  // Activity counts: Basic metrics showing community activity.

  // Gear items shared in the community.
  int32 gear_count = 9;

  // Loans (Sharing).
  int32 active_loans = 10;
  int32 completed_loans = 11;

  // Giveaways (Giving).
  int32 open_giveaways = 12;
  int32 completed_giveaways = 13;

  // Requests (Help).
  int32 open_requests = 14;
  int32 fulfilled_requests = 15;

  // Events (Experiences).
  int32 upcoming_events = 16;
  int32 past_events = 17;
  int32 total_events = 30;  // Computed: upcoming_events + past_events

  // Members.
  int32 member_count = 18;

  // Computed totals for display convenience.
  int32 total_loans = 31;  // Computed: active_loans + completed_loans

  // Cost savings: Estimated USD saved by sharing instead of buying (mean + stddev).
  Estimate cost_savings_usd = 21;

  // Number of transactions with cost savings (for context).
  int32 cost_savings_count = 22;

  // Carbon savings: Estimated grams CO2e avoided by sharing (mean + stddev).
  Estimate carbon_savings_grams = 23;

  // Number of transactions with carbon savings (for context).
  int32 carbon_savings_count = 24;

  // Time banked: Estimated minutes saved/exchanged through community (mean + stddev).
  // Sum of time from loans, skills, and requests.
  Estimate time_banked_minutes = 25;

  // Breakdown of time banked sources for transparency (all in minutes).
  Estimate time_from_loans_minutes = 26;
  Estimate time_from_skills_minutes = 27;
  Estimate time_from_requests_minutes = 28;

  // Total estimated value of all community items.
  // Sum of value_estimate_usd for all active gear.
  // Items without value estimates are excluded (counted as 0).
  float total_value_usd = 29;

  // Quality Time: Estimated minutes of quality social time generated by community sharing.
  // Aggregated from all completed transfers, fulfilled requests, and completed experiences.
  Estimate quality_time_minutes = 32;

  reserved 1, 2, 3, 4, 5, 19, 20;
}

// UserImpactMetrics represents the aggregated impact metrics for a single user
// across all their contributions. Shows how much value/time/CO2 the user's
// sharing has saved others.
message UserImpactMetrics {
  // Activity counts showing user's contributions.

  // Number of items the user has shared.
  int32 items_shared = 1;

  // Number of communities the user belongs to.
  int32 community_count = 2;

  // Loans (items lent to others).
  int32 active_loans = 3;
  int32 completed_loans = 4;
  int32 total_loans = 5;  // Computed: active_loans + completed_loans

  // Borrows (items borrowed from others).
  int32 active_borrows = 6;
  int32 completed_borrows = 7;
  int32 total_borrows = 8;  // Computed: active_borrows + completed_borrows

  // Giveaways (items given away).
  int32 completed_giveaways = 9;

  // Requests (help offered to others).
  int32 fulfilled_requests = 10;

  // Events created or hosted.
  int32 events_created = 11;

  // Total estimated value of all user's items.
  // Sum of value_estimate_usd for all active gear owned by user.
  // Items without value estimates are excluded (counted as 0).
  float total_value_usd = 12;

  // Savings metrics: Impact of user's contributions on others.

  // Cost savings: Estimated USD saved by others through this user's sharing (mean + stddev).
  Estimate cost_savings_usd = 13;

  // Number of transactions with cost savings (for context).
  int32 cost_savings_count = 14;

  // Carbon savings: Estimated grams CO2e avoided through this user's sharing (mean + stddev).
  Estimate carbon_savings_grams = 15;

  // Number of transactions with carbon savings (for context).
  int32 carbon_savings_count = 16;

  // Time banked: Estimated minutes saved/exchanged through user's contributions (mean + stddev).
  Estimate time_banked_minutes = 17;

  // Breakdown of time banked sources for transparency (all in minutes).
  Estimate time_from_loans_minutes = 18;
  Estimate time_from_skills_minutes = 19;
  Estimate time_from_requests_minutes = 20;

  // Quality Time: Estimated minutes of quality social time generated by this user's sharing.
  // Aggregated from all completed transfers, fulfilled requests, and completed experiences.
  Estimate quality_time_minutes = 21;
}

