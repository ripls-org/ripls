// Impact estimation types for money saved, emissions prevented, and time saved.

syntax = "proto3";

package ripls.api;

option go_package = "go.ripls.org/ripls/server/gen/ripls/api;api";

import "ripls/api/common.proto";

// ImpactEstimate contains all four dimensions of impact for a transaction.
message ImpactEstimate {
  // Money saved by sharing instead of buying/hiring.
  MoneySavings money_saved = 1;

  // Carbon emissions prevented by avoiding manufacture/waste.
  PreventedEmissions emissions_prevented = 2;

  // Time saved by sharing instead of shopping/hiring.
  TimeSavings time_saved = 3;

  // Quality time generated by the social interaction.
  QualityTimeEstimate quality_time = 4;
}

// MoneySavingsInput holds the individual input values used to compute MoneySavings.
// Each field corresponds to one factor in the savings calculation.
message MoneySavingsInput {
  // Estimated commercial equivalent value in USD (e.g., hire cost for a service).
  optional Estimate hire_equivalent_value = 1;

  // How the hire_equivalent_value was determined.
  optional Provenance hire_equivalent_value_provenance = 2;

  // Per-contribution value inputs for requests or experiences with planning contributions.
  repeated ContributionValueInput contribution_inputs = 3;
}

// ContributionValueInput holds the value attributed to a single planning contribution.
message ContributionValueInput {
  // ID of the planning contribution this input is attributed to.
  string planning_contribution_id = 1;

  // Estimated value in USD for this contribution.
  optional Estimate value_usd = 2;

  // How the value was determined.
  optional Provenance provenance = 3;
}

// MoneySavings represents the monetary value saved by a sharing transaction.
message MoneySavings {
  // Estimated money saved in US dollars (mean + uncertainty).
  Estimate value_usd = 1;

  // How this money savings estimate was produced.
  Provenance provenance = 2;

  // Structured inputs used to compute value_usd.
  optional MoneySavingsInput inputs = 10;
}

// PreventedEmissionsInput holds the individual input values used to compute PreventedEmissions.
message PreventedEmissionsInput {
  // Carbon avoided by not traveling to an alternative venue or store.
  optional Estimate travel_avoided_carbon = 1;

  // How the travel_avoided_carbon was determined.
  optional Provenance travel_avoided_carbon_provenance = 2;

  // Carbon credit from repair activity (fraction of embodied carbon saved).
  optional Estimate repair_credit_carbon = 3;

  // How the repair_credit_carbon was determined.
  optional Provenance repair_credit_carbon_provenance = 4;

  // Per-contribution emissions inputs for requests or experiences with planning contributions.
  repeated ContributionEmissionsInput contribution_inputs = 5;
}

// ContributionEmissionsInput holds the emissions attributed to a single planning contribution.
message ContributionEmissionsInput {
  // ID of the planning contribution this input is attributed to.
  string planning_contribution_id = 1;

  // Embodied carbon of the item contributed (grams CO2e).
  optional Estimate embodied_carbon = 2;

  // How the embodied carbon was determined.
  optional Provenance embodied_carbon_provenance = 3;

  // Waste carbon of the item contributed (grams CO2e).
  optional Estimate waste_carbon = 4;

  // How the waste carbon was determined.
  optional Provenance waste_carbon_provenance = 5;

  // Weight of the item in grams (used to compute waste_carbon).
  float weight_grams = 6;

  // Material category used to compute embodied_carbon (e.g., "solid_metal").
  string material = 7;
}

// PreventedEmissions represents carbon emissions avoided by a sharing transaction.
// The displayed total is the sum of manufacture_avoided_carbon and waste_reduced_carbon.
message PreventedEmissions {
  // Emissions avoided by not manufacturing a new item.
  // Product of embodied carbon and purchase avoidance probability.
  CarbonEstimate manufacture_avoided_carbon = 1;

  // Emissions avoided by diverting an item from waste.
  // Product of item weight and waste carbon factor.
  CarbonEstimate waste_reduced_carbon = 2;

  // How this emissions estimate was produced.
  Provenance provenance = 3;

  // Structured inputs used to compute manufacture_avoided_carbon and waste_reduced_carbon.
  optional PreventedEmissionsInput inputs = 10;
}

// TimeSavings represents time saved by a sharing transaction.
message TimeSavings {
  // Estimated time saved in minutes (mean + uncertainty).
  Estimate minutes = 1;

  // How this time savings estimate was produced.
  Provenance provenance = 2;
}

// SocialModality classifies the interaction channel for a transaction.
enum SocialModality {
  SOCIAL_MODALITY_UNSPECIFIED = 0;
  SOCIAL_MODALITY_IN_PERSON_SHARED = 1;    // Shared in-person activity (e.g., experience, workshop)
  SOCIAL_MODALITY_IN_PERSON_BRIEF = 2;     // Brief in-person exchange (e.g., gear handoff)
  SOCIAL_MODALITY_VIDEO = 3;               // Remote video call
  SOCIAL_MODALITY_PHONE = 4;               // Phone or voice call
  SOCIAL_MODALITY_TEXT = 5;                // Text or async messaging
}

// SocialTieStrength classifies the relationship depth between two users.
enum SocialTieStrength {
  SOCIAL_TIE_STRENGTH_UNSPECIFIED = 0;
  SOCIAL_TIE_STRENGTH_NEW = 1;             // No prior interactions
  SOCIAL_TIE_STRENGTH_ACQUAINTANCE = 2;    // 1–3 prior interactions
  SOCIAL_TIE_STRENGTH_ACTIVE = 3;          // 4–10 prior interactions
  SOCIAL_TIE_STRENGTH_CLOSE = 4;           // 11+ prior interactions
}

// SocialReciprocity classifies the user's role in the transaction.
enum SocialReciprocity {
  SOCIAL_RECIPROCITY_UNSPECIFIED = 0;
  SOCIAL_RECIPROCITY_GIVING = 1;           // Lender, giver, or helper
  SOCIAL_RECIPROCITY_RECEIVING = 2;        // Borrower or recipient
  SOCIAL_RECIPROCITY_MUTUAL = 3;           // Shared experience or collaborative request
}

// SocialNovelty classifies whether this interaction type is novel for these users.
enum SocialNovelty {
  SOCIAL_NOVELTY_UNSPECIFIED = 0;
  SOCIAL_NOVELTY_NOVEL = 1;                // First interaction of this type
  SOCIAL_NOVELTY_INFREQUENT = 2;           // Same type, last occurred >30 days ago
  SOCIAL_NOVELTY_ROUTINE = 3;              // Same type occurred within last 30 days
}

// SocialVulnerabilityLevel classifies the personal vulnerability involved.
enum SocialVulnerabilityLevel {
  SOCIAL_VULNERABILITY_LEVEL_UNSPECIFIED = 0;
  SOCIAL_VULNERABILITY_LEVEL_LOW = 1;            // Low personal vulnerability (0.8×)
  SOCIAL_VULNERABILITY_LEVEL_MEDIUM = 2;         // Medium vulnerability (1.0×)
  SOCIAL_VULNERABILITY_LEVEL_HIGH = 3;           // High vulnerability, e.g., hosting at home (1.3×)
}

// QualityTimeAttributes stores the resolved per-transaction attribute tiers that produced the Quality Time score.
// These are the actual estimated values, not the weights, for display and auditability.
message QualityTimeAttributes {
  // Estimated face-to-face interaction duration in minutes.
  float estimated_duration_minutes = 1;

  // How the duration estimate was produced.
  optional Provenance estimated_duration_minutes_provenance = 8;

  // Communication channel for this interaction.
  SocialModality modality = 2;

  // How the modality classification was determined.
  optional Provenance modality_provenance = 9;

  // Number of participants in the interaction.
  int32 group_size = 3;

  // How the group size was determined.
  optional Provenance group_size_provenance = 10;

  // Relationship depth tier between the two users.
  SocialTieStrength tie_strength = 4;

  // How the tie strength tier was determined.
  optional Provenance tie_strength_provenance = 11;

  // Reciprocity role for the initiating user.
  SocialReciprocity reciprocity = 5;

  // How the reciprocity role was determined.
  optional Provenance reciprocity_provenance = 12;

  // Novelty of this interaction type for these users.
  SocialNovelty novelty = 6;

  // How the novelty classification was determined.
  optional Provenance novelty_provenance = 13;

  // Personal vulnerability level involved in the transaction.
  SocialVulnerabilityLevel vulnerability = 7;

  // How the vulnerability level was determined.
  optional Provenance vulnerability_provenance = 14;
}

// QualityTimeEstimate represents the relational value generated by a sharing
// interaction. One Quality Time minute approximates one minute of quality
// in-person social contact.
message QualityTimeEstimate {
  // Composite Quality Time score in minutes (hero metric).
  Estimate quality_time_minutes = 1;

  // Estimated minutes of meaningful face-to-face co-presence (duration × modality).
  Estimate belonging_minutes = 2;

  // Trust-building score reflecting vulnerability and reciprocity (vulnerability × reciprocity).
  Estimate trust_credits = 3;

  // How this Quality Time estimate was produced.
  Provenance provenance = 4;

  // Resolved attribute tiers that produced this Quality Time score, for display and audit.
  QualityTimeAttributes attributes = 5;
}

// ConnectionContext is a lightweight input to the RM builder, resolved from
// transaction history and the community graph at build time. Not persisted.
message ConnectionContext {
  // Number of prior completed transactions between these two users.
  int32 prior_interaction_count = 1;

  // Number of shared connections in the community graph.
  int32 mutual_connection_count = 2;

  // Number of unique counterparts the initiating user has interacted with
  // in the current week (for network diversity scoring).
  int32 distinct_contacts_this_week = 3;
}
