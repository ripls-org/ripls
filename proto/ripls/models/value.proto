// Value estimation for shareable items (gear, experiences, requests).

syntax = "proto3";

package ripls.models;

option go_package = "go.ripls.org/ripls/server/gen/ripls/models;models";

import "ripls/models/common.proto";

// ValueEstimate contains LLM-generated value estimation with provenance.
// Used to estimate the monetary value of shared items for impact metrics.
message ValueEstimate {
  // Estimated value in USD (e.g., 50.0 = $50.00).
  // Returns 0 if unable to estimate.
  float estimated_value_usd = 1;

  // How this value estimate was produced (source, reasoning, references).
  Provenance provenance = 5;

  // Fields 2-4 were confidence (float), reasoning (string), sources (repeated string)
  // before provenance migration.
  reserved 2, 3, 4;
}
