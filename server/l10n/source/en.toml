# The default line, used by any event type with no bespoke copy, in four
# wordings picked by which names the payload actually carries (see
# Content.messageKind). Only `default` has a .cta — all four share it.
# `default_bare` is the one that matters: system-generated notifications have no
# actor and no community, and before #2896 they rendered "  posted an update in ".
[notif.offapp.default.message]
other = "{{.ActorName}} posted an update in {{.CommunityName}}"
[notif.offapp.default_actor.message]
other = "{{.ActorName}} posted an update"
[notif.offapp.default_community.message]
other = "There's an update in {{.CommunityName}}"
[notif.offapp.default_bare.message]
other = "You have an update on Ripls"
[notif.offapp.default.cta]
other = "View at"

# --- Name stand-ins ---
#
# Substituted for any name that resolved empty, so a missed storage lookup
# renders "Someone is attending an event" rather than "  is attending ".
# Applied in notification_content.params for push, SMS and email alike.
[notif.standin.actor]
other = "Someone"
[notif.standin.experience]
other = "an event"
[notif.standin.gear]
other = "an item"
[notif.standin.request]
