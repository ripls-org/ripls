# English server l10n source catalog.
#
# Source of truth for every server-rendered user-visible string.
# Every key here must have a matching entry in every other locale
# under server/l10n/source/. CI parity check fails the build
# otherwise.
#
# Key naming convention:
#   notif.community_event.<event_kind>.{title,body}
#   notif.chat.<role>
#   email.<flow>.subject  (Phase 3)
#   email.<flow>.<role>   (Phase 3, in-template snippets)
#   common.<name>         (cross-surface strings)
#
# Values use go-i18n message format:
#   [my.key]
#   other = "Template with {{.Param}} substitution"
#
# Note: user-visible strings refer to scheduled gatherings as
# "Event" (per CLAUDE.md § "UI Terminology: 'Event', not
# 'Experience'"), even though the code identifier is Experience.

