# --- SMS (text-message) copy ---
#
# Text messages are a server-rendered surface (docs/server/l10n.md render
# boundary). {{.Message}} is the already-localized notification content;
# {{.Url}} is the /go/{code} link. The STOP/HELP keywords are fixed,
# carrier-recognized SMS commands and stay literal even in translated copy.
#
# Inbound STOP/HELP/START auto-replies are NOT here: Twilio's Messaging Service
# opt-out management sends those (configured in the Twilio console), so our
# webhook is persist-only and renders no reply (avoids double-texting).

# The body of an outbound platform text: notification content and the link. The
# STOP/HELP opt-out footer (sms.optout) is appended by the dispatcher only on the
# first message and then ~monthly (notifications.shouldDiscloseOptOut), not here.
[sms.notification.body]
other = "{{.Message}}{{if .Url}} {{.Url}}{{end}}"

# --- Off-app notification copy (NOTIF-1) -----------------------------------
# Uniform SMS/email wrappers + per-kind self-contained message + CTA verb.
# Rendered by server/notifications/notifcopy. The "Ripls:" prefix brands the
# 10DLC long code on every message; the opt-out footer rides the first platform
# SMS and then only ~monthly (the keywords are honored centrally regardless).

[sms.brand_prefix]
other = "Ripls:"

[sms.optout]
other = "Reply STOP to opt out, HELP for help."

# One-time opt-in confirmation ("welcome") text, sent on first opt-in
# (PhoneRegister) via the platform SMS/RCS channel. Self-contained: it carries
# its own STOP/HELP, frequency, and rate disclosure, so the dispatcher must NOT
# append sms.optout to it. Required as a sample for US RCS/A2P registration; the
# live send also lets a carrier reviewer confirm the opt-in flow end-to-end.
[sms.welcome.body]
other = "Welcome to Ripls! Let's lean on each other. You'll get event invites and community updates. Message & data rates may apply. Message frequency varies. Reply HELP for help, STOP to opt out.{{if .AppURL}}\n\nConnect at {{.AppURL}}{{end}}"

