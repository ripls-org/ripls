# --- SSR web landing pages (#2090) ---
#
# The /go/{code} landing pages (invite.html, event.html, gear.html,
# request.html) are a server-rendered surface: the Go web service is the
# terminal emitter, so their copy lives here and renders in the visitor's
# Accept-Language locale. Keys are web.<page>.<role>; strings shared across
# pages use web.common.* / web.error.*.

# Visitor-facing error copy shown on the shared invite.html error surface
# when a share link can't be resolved to a live target. These are the
