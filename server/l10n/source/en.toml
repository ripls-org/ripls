# --- System-generated notifications (reminders, prompts) ---
#
# These have no actor: a job produces them, not a person. Each carries all three
# subkeys, so one sentence (.message) serves push, SMS and email, with .title
# adding the push's category label and .cta the off-app link verb. Before #2896
# their copy lived in fmt.Sprintf calls in the producers and never reached the
# off-app surfaces at all, which is how a reminder text came out as
# "Ripls:  posted an update in ".

[notif.community_event.experience_reminder_day_before.title]
other = "Event tomorrow"
[notif.offapp.experience_reminder_day_before.message]
other = "{{.ExperienceName}} is tomorrow"
[notif.offapp.experience_reminder_day_before.cta]
other = "See details at"

[notif.community_event.experience_reminder_two_hour.title]
other = "Event starting soon"
[notif.offapp.experience_reminder_two_hour.message]
other = "{{.ExperienceName}} starts in 2 hours"
[notif.offapp.experience_reminder_two_hour.cta]
other = "See details at"

[notif.community_event.experience_reminder_starting.title]
other = "Event starting now"
[notif.offapp.experience_reminder_starting.message]
other = "{{.ExperienceName}} is starting"
[notif.offapp.experience_reminder_starting.cta]
other = "See details at"

# Fallback for a payload minted before the per-offset split, e.g. a push already
# queued at FCM when the new binary rolled out.
[notif.community_event.experience_reminder.title]
other = "Upcoming event"
[notif.offapp.experience_reminder.message]
