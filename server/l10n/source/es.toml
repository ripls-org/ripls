# --- Página de invitación a comunidad (community.html): un enlace simple para
# "unirse a este grupo", la cuarta página de aterrizaje phone-first junto a
# evento/artículo/petición (#2875). {{.Inviter}} es el nombre de pila de quien
# invita; {{.Community}} es el nombre visible de la comunidad (la etiqueta
# genérica "un grupo de Ripls" cuando no tiene nombre). La página no expone
# ningún nombre de miembro, solo un conteo.

[web.community.kicker]
other = "Invitación"

# headline lleva ambos nombres en línea (el <h1> es el nombre de la comunidad,
# así que esta es la línea OG/título); inviter_line es la descripción OG/meta;
# role es la frase verbal que acompaña al nombre resaltado de quien invita.
[web.community.headline]
other = "{{.Inviter}} te invitó a unirte a {{.Community}}"
[web.community.headline_unnamed]
other = "{{.Inviter}} te invitó a un grupo de Ripls"
[web.community.inviter_line]
other = "{{.Inviter}} te invitó"
[web.community.role]
other = "te invitó"

[web.community.cta_label]
other = "Unirme al grupo"
[web.community.cta_aria]
other = "Unirme a {{.Community}} en Ripls"

# Conteo de miembros bajo el encabezado. Sin nombres: una página pública y
# previa a la autenticación nunca revela quién está en un grupo, solo cuántos.
[web.community.members]
one = "{{.Count}} miembro"
other = "{{.Count}} miembros"

# Descripción para la vista previa del enlace. La segunda frase es lo que hace
# legible la tarjeta para alguien que nunca ha oído hablar de Ripls.
[web.community.og_desc]
other = "{{.InviterLine}}. Comparte y toma prestado con gente cercana."

