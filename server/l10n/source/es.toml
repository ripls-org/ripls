# --- Copia para SMS (mensajes de texto) ---
#
# Los mensajes de texto los renderiza el servidor (límite de renderizado en
# docs/server/l10n.md). {{.Message}} es el contenido de la notificación ya
# localizado; {{.Url}} es el enlace /go/{code}. Las palabras clave STOP/HELP
# son comandos de SMS fijos que reconocen los operadores y se mantienen
# literales aunque el texto esté traducido.
#
# Las respuestas automáticas a STOP/HELP/START entrantes NO están aquí: las
# envía la gestión de cancelaciones del Messaging Service de Twilio (configurada
# en la consola de Twilio); nuestro webhook solo persiste y no responde.

# Cuerpo de un mensaje de texto saliente: contenido, enlace y el pie de
# cancelación obligatorio.
[sms.notification.body]
other = "{{.Message}}{{if .Url}} {{.Url}}{{end}}"

