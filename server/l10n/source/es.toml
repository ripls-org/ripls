# --- Páginas SSR de destino web (#2090) ---
#
# Las páginas de destino /go/{code} (invite.html, event.html, gear.html,
# request.html) son una superficie renderizada por el servidor: el servicio
# web Go es el emisor final, así que su copia vive aquí y se renderiza en el
# idioma Accept-Language del visitante. Las claves son web.<página>.<rol>;
# las cadenas compartidas usan web.common.* / web.error.*.

# Copia de error visible en la superficie de error compartida de invite.html
# cuando un enlace no se puede resolver a un destino activo. Son los mensajes
# genéricos y seguros que llegan al cliente; los errores de almacenamiento
# nunca lo hacen.
[web.error.no_code]
other = "No se proporcionó ningún código de invitación."

[web.error.generic]
other = "Algo salió mal. Inténtalo de nuevo."

[web.error.link_invalid]
other = "Este enlace de invitación no es válido."

[web.error.link_revoked]
other = "Este enlace de invitación fue revocado."

[web.error.event_unavailable]
other = "Este evento ya no está disponible."

[web.error.item_unavailable]
other = "Este artículo ya no está disponible."

[web.error.request_unavailable]
other = "Esta solicitud ya no está disponible."

