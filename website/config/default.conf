server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Host canonicalization (SEO). Nginx-Proxy-Manager terminates TLS and proxies
    # every marketing hostname to this one container with the original Host header
    # preserved (the staging server block relies on that same forwarding for its
    # branch-slug regex). Without this, ripls.org, www.ripls.org, type2fun.org and
    # www.type2fun.org all answer 200 for identical content, so Google clusters
    # them as "Duplicate without user-selected canonical" and indexes none. 301 the
    # three alias hosts to the single canonical host (https://ripls.org) so exactly
    # one URL is indexable; other Host values (localhost, container healthchecks)
    # keep serving normally.
    #
    # Prod-only: staging uses its own server block
    # (infra/staging-web/config/default.conf) and must keep serving every
    # *.staging.ripls.org branch host, so this rule lives here and NOT in the
    # shared locations.include.
    if ($host ~* ^(www\.ripls\.org|(www\.)?type2fun\.org)$) {
        return 301 https://ripls.org$request_uri;
    }

    # Shared routing rules (home page at /, deep links, static fallback).
    # Kept in one file that staging includes too, so the two never drift.
    include /etc/nginx/conf.d/locations.include;
}
