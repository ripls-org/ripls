<!-- Standard favicon (works in most browsers) -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<!-- Modern browsers with PNG support -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">

<!-- Adaptive SVG favicon with embedded dark mode CSS -->
<!-- This single SVG works in all modern browsers (Chrome, Firefox, Safari, Edge) -->
<!-- The embedded @media (prefers-color-scheme: dark) automatically switches colors -->
<link rel="icon" type="image/svg+xml" href="/icon.svg">

<!-- Apple Touch Icon (iOS) -->
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
