<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Ripls</title>

  <script>
    fetch('/favicon-links.html')
      .then(response => response.text())
      .then(html => document.head.insertAdjacentHTML('beforeend', html));
  </script>

  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/deeplink.css">
</head>
<body>
  <header>
    <img src="assets/logo.png" alt="Ripls Logo" class="logo-image">
    <div class="logo-text">ripls</div>
  </header>

  <main class="deeplink-container">
    <div class="deeplink-card">
      <h1>Reset Your Password</h1>
      <p>
        Click below to open the Ripls app and set your new password.
      </p>

      <div class="buttons">
        <button class="btn btn-primary" onclick="openApp()">
          Open Ripls App
        </button>
      </div>

      <div id="status" class="status">Opening app...</div>

      <div id="app-buttons" class="buttons">
        <div class="store-links">
          <a
            href="https://testflight.apple.com/join/gFSEbHaY"
            target="_blank"
            rel="noopener"
            class="store-btn"
          >
            <svg class="store-btn-icon" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
            </svg>
            <span class="store-btn-text">
              <span class="store-btn-label">Join Beta on</span>
              <span class="store-btn-store">TestFlight</span>
            </span>
          </a>
          <a
            href="https://play.google.com/store/apps/details?id=org.ripls.app"
            target="_blank"
            rel="noopener"
            class="store-btn"
          >
            <svg class="store-btn-icon" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
              <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
            </svg>
            <span class="store-btn-text">
              <span class="store-btn-label">Get it on</span>
              <span class="store-btn-store">Google Play</span>
            </span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>Type2Fun Foundation, PBC · 2025</p>
      <p><a href="/privacy-policy.html">Privacy Policy</a></p>
    </div>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");

    function buildDeepLinkUrl() {
      if (!token) return null;
      return `ripls://reset-password?token=${encodeURIComponent(token)}`;
    }

    function openApp() {
      const deepLink = buildDeepLinkUrl();
      const status = document.getElementById("status");

      if (!deepLink) {
        status.textContent = "Invalid reset link. Please check your email and try again.";
        status.classList.add("error");
        return;
      }

      window.location.href = deepLink;
      status.textContent = "Opening app...";

      setTimeout(() => {
        status.textContent = "Don't have the app? Download it below:";
      }, 2000);
    }

    if (token) {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile) {
        openApp();
      } else {
        document.getElementById("status").textContent =
          "To reset your password, download the Ripls app:";
      }
    } else {
      const status = document.getElementById("status");
      status.textContent = "Invalid reset link. Please check your email and try again.";
      status.classList.add("error");
    }
  </script>
</body>
</html>
